<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DK 1030단어 그림단어장</title>
<meta name="theme-color" content="#2b2a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DK 단어장">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- 홈 화면 앱(PWA) -->
<link rel="manifest" href="manifest.json?v=1">
<script>
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>


<!-- 폰트/Firebase DNS 사전 연결 (iOS Safari 로딩 속도 개선) -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=7">

<!-- Firebase는 학생 환영 메시지에만 쓰여서 화면 렌더링을 막지 않도록 defer -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script defer src="firebase-shared.js"></script>
</head>
<body>

  <!-- ===== 목록 화면 ===== -->
  <div id="list-view">
    <div class="top-bar">
      <div class="title-row">
        <h1>그림 단어장</h1>
        <button id="mydk-btn" class="mydk-btn" type="button">My DK</button>
      </div>
      <p class="sub" id="welcome-line">단어를 터치하면 읽어줘요</p>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="단어 검색 (예: goat)" autocomplete="off">
      </div>
      <div class="alpha-strip" id="alpha-strip"></div>
    </div>
    <div class="word-count" id="word-count"></div>
    <div id="grid-container"></div>
  </div>

  <!-- ===== 재생 화면 ===== -->
  <div id="player-view" class="hidden">
    <div class="player-top">
      <button class="back-btn" id="back-btn">← 목록</button>
      <div class="progress" id="progress-label"></div>
      <div class="goal-pill hidden" id="goal-pill"></div>
      <button class="auto-btn" id="auto-btn">▶ 자동재생</button>
      <div class="status-pill" id="status-pill">단어 읽는 중...</div>
    </div>

    <div class="card-stage" id="card-stage">
      <div id="card-frame">
        <img id="card-image" src="" alt="" draggable="false">
        <video id="motion-video" class="hidden" playsinline preload="auto"></video>
        <div id="pulse" class="pulse hidden"></div>
        <div id="hs-layer"></div>
        <div id="popup" class="popup hidden"></div>
      </div>
    </div>

    <div class="player-nav">
      <button class="nav-btn" id="prev-btn"><span class="ic">◀</span><span class="tx">이전</span></button>
      <button class="nav-btn next" id="next-btn"><span class="ic">▶</span><span class="tx">다음</span></button>
    </div>

    <div class="rotate-hint" id="rotate-hint">📱 폰을 가로로 돌리면 더 크게 볼 수 있어요</div>
  </div>

  <audio id="audio-w" preload="auto"></audio>
  <audio id="audio-d" preload="auto"></audio>
  <audio id="audio-r" preload="auto"></audio>
  <audio id="audio-s" preload="auto"></audio>

  <script defer src="app.js?v=7"></script>
</body>
</html>
