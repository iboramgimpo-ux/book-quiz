<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그림 단어장 - 학생 링크 관리</title>

<!-- 폰트/Firebase/cdnjs DNS 사전 연결 (iOS Safari 로딩 속도 개선) -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-shared.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap">
<style>
  :root {
    --ink: #241f5e;
    --ink-soft: #4a4494;
    --coral: #e0483e;
    --sky: #eaf6ff;
    --sky-deep: #cdeaff;
    --paper: #fffdf8;
    --line: #d9e8f5;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; background: var(--sky); font-family:'Gaegu', sans-serif; color: var(--ink); }
  #root { min-height: 100vh; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

function IconPlus({ size=13, color="currentColor" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
}
function IconChevronDown({ size=13, color="currentColor" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
}
function IconCheck({ size=13, color="currentColor" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
}
function IconSearch({ size=16, color="currentColor" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
}

function PasswordGate({ children }) {
  // 관리자 비밀번호 (기존 학생관리 사이트와 동일)
  const ADMIN_PASSWORD = "bookquiz2024";
  const [unlocked, setUnlocked] = useState(false);
  const [input, setInput] = useState("");
  const [error, setError] = useState(false);
  const [checked, setChecked] = useState(false);

  useEffect(() => {
    try {
      if (sessionStorage.getItem("wordapp-admin-unlocked") === "1") setUnlocked(true);
    } catch (e) {}
    setChecked(true);
  }, []);

  const submit = (e) => {
    e.preventDefault();
    if (input === ADMIN_PASSWORD) {
      setUnlocked(true);
      setError(false);
      try { sessionStorage.setItem("wordapp-admin-unlocked", "1"); } catch (e) {}
    } else {
      setError(true);
    }
  };

  if (!checked) return null;
  if (unlocked) return children;

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background: "#241f5e" }}>
      <form onSubmit={submit} style={{ width:"100%", maxWidth:320, padding:"32px 28px", borderRadius:20, background:"#fffdf8" }}>
        <div style={{ textAlign:"center", marginBottom:18 }}>
          <div style={{ width:48, height:48, margin:"0 auto 10px", borderRadius:14, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, background:"#eaf6ff" }}>🔑</div>
          <h1 style={{ fontFamily:"'Jua',sans-serif", fontSize:19, margin:0, color:"#241f5e" }}>학생 링크 관리자</h1>
          <p style={{ fontSize:13, margin:"4px 0 0", color:"#4a4494" }}>비밀번호를 입력해주세요</p>
        </div>
        <input
          type="password"
          value={input}
          onChange={(e) => { setInput(e.target.value); setError(false); }}
          autoFocus
          placeholder="비밀번호"
          style={{ width:"100%", padding:"11px 13px", borderRadius:12, border: error ? "2px solid #e0483e" : "2px solid #cdeaff", outline:"none", marginBottom:8 }}
        />
        {error && <p style={{ fontSize:12, color:"#e0483e", margin:"0 0 8px" }}>비밀번호가 틀렸어요</p>}
        <button type="submit" style={{ width:"100%", padding:"11px", borderRadius:12, border:"none", background:"#241f5e", color:"#fff", fontFamily:"'Jua',sans-serif", fontSize:15, marginTop:4 }}>
          입장하기
        </button>
      </form>
    </div>
  );
}

const PROG_PREFIX = "dkprog_";   // word-app이 학생별 학습 기록을 저장하는 문서 이름 앞부분

function fmtDate(ts) {
  try { const d = ts.toDate(); return (d.getMonth() + 1) + "/" + d.getDate(); } catch (e) { return ""; }
}
function getCycle(p) { return p && typeof p.cycle === "number" ? p.cycle : null; }
function recordText(p) {
  const cyc = getCycle(p);
  if (cyc === null) return null;
  if (typeof p.maxIdx !== "number" || p.maxIdx < 0 || !p.lastWord) return cyc + "바퀴 - 아직 학습 기록 없음";
  return cyc + "바퀴 - " + String(p.lastWord).toLowerCase() + "까지 완료";
}

function AdminApp() {
  const [tab, setTab] = useState("links");
  const [allStudents, setAllStudents] = useState([]);
  const [progress, setProgress] = useState({});
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [progressError, setProgressError] = useState("");
  const [reloading, setReloading] = useState(false);

  const loadProgress = async () => {
    try {
      const snap = await db.collection("kv")
        .where(firebase.firestore.FieldPath.documentId(), ">=", PROG_PREFIX)
        .where(firebase.firestore.FieldPath.documentId(), "<", PROG_PREFIX + "\uf8ff")
        .get();
      const map = {};
      snap.forEach((doc) => { map[doc.id.slice(PROG_PREFIX.length)] = doc.data(); });
      setProgress(map);
      setProgressError("");
    } catch (e) {
      console.error("학습 기록 불러오기 실패:", e);
      setProgressError("학습 기록을 불러오지 못했어요. Firestore 보안규칙에서 kv 컬렉션 읽기 권한을 확인해주세요.");
    }
  };

  useEffect(() => {
    (async () => {
      try {
        const snap = await db.collection("students").get();
        const list = [];
        snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
        setAllStudents(list.filter((s) => !s.withdrawn));
      } catch (e) {
        console.error("학생 목록 불러오기 실패:", e);
        setLoadError("학생 목록을 불러오지 못했어요. Firestore 보안규칙에서 이 사이트의 읽기 권한을 허용했는지 확인해주세요.");
      }
      await loadProgress();
      setLoading(false);
    })();
  }, []);

  const reload = async () => { setReloading(true); await loadProgress(); setReloading(false); };

  // 관리자가 바퀴 수를 직접 고칠 때 (학생이 잘못 입력한 경우)
  const saveCycle = async (student, n) => {
    await db.collection("kv").doc(PROG_PREFIX + student.id).set({ cycle: n, name: student.name || "" }, { merge: true });
    setProgress((prev) => ({ ...prev, [student.id]: { ...(prev[student.id] || {}), cycle: n, name: student.name || "" } }));
  };

  const tabBtn = (active) => ({
    flex:1, padding:"10px 0", borderRadius:12, border:"none", fontFamily:"'Jua',sans-serif", fontSize:15,
    background: active ? "#241f5e" : "#fff", color: active ? "#fff" : "#4a4494",
    boxShadow: active ? "none" : "inset 0 0 0 2px #cdeaff",
  });

  return (
    <div>
      <div style={{ maxWidth:640, margin:"0 auto", padding:"16px 16px 0", display:"flex", gap:8 }}>
        <button style={tabBtn(tab === "links")} onClick={() => setTab("links")}>학생 링크</button>
        <button style={tabBtn(tab === "records")} onClick={() => setTab("records")}>학생 기록</button>
      </div>
      {tab === "links"
        ? <StudentLinksPanel allStudents={allStudents} loading={loading} loadError={loadError} progress={progress} progressError={progressError} onSaveCycle={saveCycle} />
        : <StudentRecordsPanel allStudents={allStudents} loading={loading} loadError={loadError} progress={progress} progressError={progressError} onReload={reload} reloading={reloading} />}
    </div>
  );
}

function StudentLinksPanel({ allStudents, loading, loadError, progress, progressError, onSaveCycle }) {
  const [copiedId, setCopiedId] = useState(null);
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState({});
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");
  const [saving, setSaving] = useState(false);

  // 대표자녀(main 또는 studentType 미설정) + 형제자매 그룹핑 (기존 학생관리 사이트와 동일 로직)
  const mainStudents = useMemo(() => {
    return allStudents
      .filter((s) => s.studentType === "main" || !s.studentType)
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko"));
  }, [allStudents]);

  const siblingMap = useMemo(() => {
    const map = {};
    allStudents
      .filter((s) => s.studentType === "sibling")
      .forEach((s) => {
        if (!map[s.mainStudentId]) map[s.mainStudentId] = [];
        map[s.mainStudentId].push(s);
      });
    return map;
  }, [allStudents]);

  // 이 admin.html이 있는 위치를 기준으로 word-app.html의 경로를 만듭니다.
  const wordAppUrl = (id) => {
    // 주소창에 admin / admin.html 어느 쪽으로 들어와도 같은 폴더의 word-app.html로 연결됩니다.
    return new URL("word-app.html?student=" + encodeURIComponent(id), location.href).href;
  };

  const copyLink = (id) => {
    const url = wordAppUrl(id);
    navigator.clipboard?.writeText(url).then(
      () => { setCopiedId(id); setTimeout(() => setCopiedId(null), 1500); },
      () => { prompt("아래 링크를 복사하세요:", url); }
    );
  };

  const toggleExpand = (id) => setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));

  const startEdit = (s) => {
    const c = getCycle(progress[s.id]);
    setEditingId(s.id);
    setEditValue(c === null ? "" : String(c));
  };
  const submitEdit = async (s) => {
    const n = Number(editValue);
    if (!/^\d+$/.test(editValue.trim()) || n < 1 || n > 99) { alert("1~99 사이의 숫자를 입력해 주세요."); return; }
    setSaving(true);
    try { await onSaveCycle(s, n); setEditingId(null); }
    catch (e) { console.error(e); alert("저장하지 못했어요. 인터넷 연결과 Firestore 쓰기 권한을 확인해 주세요."); }
    setSaving(false);
  };

  const q = search.trim().toLowerCase();
  const visibleMains = q ? mainStudents.filter((s) => (s.name || "").toLowerCase().includes(q)) : mainStudents;

  const card = { background:"#fffdf8", border:"2px solid #cdeaff", borderRadius:14, overflow:"hidden" };
  const rowBtn = (active) => ({
    flexShrink:0, display:"flex", alignItems:"center", gap:5, padding:"8px 11px", borderRadius:10,
    fontSize:13, fontFamily:"'Jua',sans-serif", border:"none",
    background: active ? "#e7f3e9" : "#241f5e", color: active ? "#2e6b3e" : "#fff",
  });
  // 링크 복사(남색)와 헷갈리지 않도록 주황색 계열
  const editBtn = { flexShrink:0, padding:"7px 10px", borderRadius:10, border:"none", fontSize:12, fontFamily:"'Jua',sans-serif", background:"#f59e0b", color:"#fff" };
  const cancelBtn = { flexShrink:0, padding:"7px 9px", borderRadius:10, border:"none", fontSize:12, fontFamily:"'Jua',sans-serif", background:"#eee", color:"#555" };

  const renderActions = (s) => {
    const cyc = getCycle(progress[s.id]);
    if (editingId === s.id) {
      return (
        <div style={{ display:"flex", alignItems:"center", gap:5, flexShrink:0 }}>
          <input
            type="number" inputMode="numeric" min="1" max="99" autoFocus
            value={editValue} onChange={(e) => setEditValue(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submitEdit(s); }}
            style={{ width:54, padding:"7px 6px", borderRadius:8, border:"2px solid #f59e0b", textAlign:"center", outline:"none" }}
          />
          <span style={{ fontSize:13 }}>바퀴</span>
          <button disabled={saving} onClick={() => submitEdit(s)} style={editBtn}>저장</button>
          <button disabled={saving} onClick={() => setEditingId(null)} style={cancelBtn}>취소</button>
        </div>
      );
    }
    return (
      <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
        <button onClick={() => copyLink(s.id)} style={rowBtn(copiedId === s.id)}>
          {copiedId === s.id ? (<><IconCheck/> 복사됨</>) : "링크 복사"}
        </button>
        <span style={{ fontSize:14, fontWeight:700, minWidth:34, textAlign:"center", color: cyc === null ? "#b8b2a0" : "#241f5e" }}>
          {cyc === null ? "-" : cyc + "바퀴"}
        </span>
        <button onClick={() => startEdit(s)} style={editBtn}>수정</button>
      </div>
    );
  };

  return (
    <div style={{ maxWidth:640, margin:"0 auto", padding:"20px 16px 60px" }}>
      <h1 style={{ fontFamily:"'Jua',sans-serif", fontSize:22, margin:"4px 0 2px" }}>학생 링크 관리</h1>
      <p style={{ fontSize:14, color:"#4a4494", margin:"0 0 16px" }}>
        각 학생 옆 "링크 복사"를 누르면 그 학생 전용 그림 단어장 주소가 복사돼요. 오른쪽 바퀴 수는 "수정"으로 바로 고칠 수 있어요.
      </p>

      <div style={{ position:"relative", marginBottom:14 }}>
        <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"#9CA8B8" }}><IconSearch/></span>
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="학생 이름 검색..."
          style={{ width:"100%", padding:"11px 14px 11px 38px", borderRadius:12, border:"2px solid #cdeaff", outline:"none", background:"#fff" }}
        />
      </div>

      {progressError && <p style={{ fontSize:12, color:"#e0483e", margin:"0 0 10px" }}>{progressError}</p>}

      {loading ? (
        <p style={{ textAlign:"center", padding:"40px 0", color:"#9CA8B8" }}>불러오는 중...</p>
      ) : loadError ? (
        <p style={{ textAlign:"center", padding:"40px 20px", color:"#e0483e", fontSize:14 }}>{loadError}</p>
      ) : visibleMains.length === 0 ? (
        <p style={{ textAlign:"center", padding:"40px 0", color:"#9CA8B8" }}>
          등록된 학생이 없어요. (기존 학생 관리 사이트에서 먼저 학생을 등록해주세요)
        </p>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {visibleMains.map((s) => {
            const siblings = siblingMap[s.id] || [];
            const isOpen = !!expanded[s.id];
            const grade = calcCurrentGrade(s.grade, s.joinDate);
            return (
              <div key={s.id} style={card}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, padding:14 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, minWidth:0 }}>
                    {siblings.length > 0 && (
                      <button
                        onClick={() => toggleExpand(s.id)}
                        style={{ flexShrink:0, width:26, height:26, borderRadius:"50%", border:"none", background:"#eaf6ff", display:"flex", alignItems:"center", justifyContent:"center", color:"#4a4494" }}
                      >
                        {isOpen ? <IconChevronDown/> : <IconPlus/>}
                      </button>
                    )}
                    <div style={{ minWidth:0 }}>
                      <p style={{ margin:0, fontSize:16, fontWeight:700, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                        {s.name || "(이름 없음)"}
                      </p>
                      <p style={{ margin:"2px 0 0", fontSize:12, color:"#9C8F70", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                        {grade !== "-" ? grade + " · " : ""}{s.school || ""}
                      </p>
                    </div>
                  </div>
                  {renderActions(s)}
                </div>

                {isOpen && siblings.length > 0 && (
                  <div style={{ borderTop:"1px solid #eaf6ff", background:"#f5fbff" }}>
                    {siblings.map((sib) => {
                      const sibGrade = calcCurrentGrade(sib.grade, sib.joinDate);
                      return (
                        <div key={sib.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, padding:"12px 14px 12px 44px", borderTop:"1px solid #eaf6ff" }}>
                          <div style={{ minWidth:0 }}>
                            <p style={{ margin:0, fontSize:14, fontWeight:700, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                              {sib.name || "(이름 없음)"}
                              <span style={{ marginLeft:6, fontSize:10, fontWeight:400, padding:"1px 7px", borderRadius:999, background:"#eaf6ff", color:"#4a4494" }}>형제자매</span>
                            </p>
                            <p style={{ margin:"2px 0 0", fontSize:12, color:"#9C8F70" }}>
                              {sibGrade !== "-" ? sibGrade + " · " : ""}{sib.school || ""}
                            </p>
                          </div>
                          {renderActions(sib)}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function StudentRecordsPanel({ allStudents, loading, loadError, progress, progressError, onReload, reloading }) {
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("name");   // name | recent

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    const list = allStudents
      .filter((s) => !q || (s.name || "").toLowerCase().includes(q))
      .map((s) => ({ s, p: progress[s.id] }));
    const t = (r) => { try { return r.p.updatedAt.toMillis(); } catch (e) { return 0; } };
    list.sort((a, b) =>
      sortBy === "recent"
        ? (t(b) - t(a)) || (a.s.name || "").localeCompare(b.s.name || "", "ko")
        : (a.s.name || "").localeCompare(b.s.name || "", "ko"));
    return list;
  }, [allStudents, progress, search, sortBy]);

  const entered = allStudents.filter((s) => getCycle(progress[s.id]) !== null).length;
  const chip = (active) => ({
    padding:"6px 12px", borderRadius:999, border:"none", fontSize:13, fontFamily:"'Jua',sans-serif",
    background: active ? "#241f5e" : "#fff", color: active ? "#fff" : "#4a4494", boxShadow: active ? "none" : "inset 0 0 0 2px #cdeaff",
  });

  return (
    <div style={{ maxWidth:640, margin:"0 auto", padding:"20px 16px 60px" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", margin:"4px 0 2px" }}>
        <h1 style={{ fontFamily:"'Jua',sans-serif", fontSize:22, margin:0 }}>학생 기록</h1>
        <button onClick={onReload} disabled={reloading} style={{ padding:"7px 12px", borderRadius:10, border:"none", background:"#f59e0b", color:"#fff", fontFamily:"'Jua',sans-serif", fontSize:13 }}>
          {reloading ? "불러오는 중..." : "새로고침"}
        </button>
      </div>
      <p style={{ fontSize:14, color:"#4a4494", margin:"0 0 14px" }}>
        바퀴 수를 입력한 학생 {entered}명 / 전체 {allStudents.length}명
      </p>

      <div style={{ position:"relative", marginBottom:10 }}>
        <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"#9CA8B8" }}><IconSearch/></span>
        <input
          value={search} onChange={(e) => setSearch(e.target.value)} placeholder="학생 이름 검색..."
          style={{ width:"100%", padding:"11px 14px 11px 38px", borderRadius:12, border:"2px solid #cdeaff", outline:"none", background:"#fff" }}
        />
      </div>
      <div style={{ display:"flex", gap:6, marginBottom:14 }}>
        <button style={chip(sortBy === "name")} onClick={() => setSortBy("name")}>이름순</button>
        <button style={chip(sortBy === "recent")} onClick={() => setSortBy("recent")}>최근 학습순</button>
      </div>

      {progressError && <p style={{ fontSize:12, color:"#e0483e", margin:"0 0 10px" }}>{progressError}</p>}

      {loading ? (
        <p style={{ textAlign:"center", padding:"40px 0", color:"#9CA8B8" }}>불러오는 중...</p>
      ) : loadError ? (
        <p style={{ textAlign:"center", padding:"40px 20px", color:"#e0483e", fontSize:14 }}>{loadError}</p>
      ) : rows.length === 0 ? (
        <p style={{ textAlign:"center", padding:"40px 0", color:"#9CA8B8" }}>학생이 없어요.</p>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {rows.map(({ s, p }) => {
            const text = recordText(p);
            const hasStudy = p && typeof p.maxIdx === "number" && p.maxIdx >= 0;
            const total = p && p.total;
            const pct = hasStudy && total ? Math.min(100, Math.round(((p.maxIdx + 1) / total) * 100)) : 0;
            const when = p ? fmtDate(p.updatedAt) : "";
            return (
              <div key={s.id} style={{ background:"#fffdf8", border:"2px solid #cdeaff", borderRadius:14, padding:"12px 14px", opacity: text ? 1 : 0.6 }}>
                <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:8 }}>
                  <span style={{ fontSize:16, fontWeight:700 }}>{s.name || "(이름 없음)"}</span>
                  {when && <span style={{ fontSize:12, color:"#9C8F70" }}>마지막 학습 {when}</span>}
                </div>
                <p style={{ margin:"4px 0 0", fontSize:15, color: text ? "#241f5e" : "#9CA8B8" }}>
                  {text || "아직 바퀴 수를 입력하지 않았어요"}
                </p>
                {hasStudy && total ? (
                  <div style={{ marginTop:8 }}>
                    <div style={{ height:6, borderRadius:999, background:"#eaf6ff", overflow:"hidden" }}>
                      <div style={{ width:pct + "%", height:"100%", background:"#f59e0b" }} />
                    </div>
                    <p style={{ margin:"4px 0 0", fontSize:12, color:"#9C8F70" }}>{p.maxIdx + 1} / {total}단어 ({pct}%)</p>
                  </div>
                ) : null}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PasswordGate><AdminApp /></PasswordGate>);
</script>
</body>
</html>
