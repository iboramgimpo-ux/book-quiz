<script>
// ============================================================
// firebase-storage.js
// 1200 Word Dictionary - Firebase 연동 공용 스크립트 (Firestore만 사용, 무료)
//
// Storage(유료 Blaze 필요) 대신, 그림/오디오도 전부 Firestore에 직접 저장합니다.
// Firestore 문서는 1개당 1MB 제한이 있어서, 큰 필드(그림/오디오)는 자동으로
// 별도 문서에 나눠 저장하고 불러올 때 다시 합칩니다. 그래도 필드 하나가
// 900KB를 넘으면 저장이 안 되니, 그럴 땐 파일을 더 압축해서 올려주세요.
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCPa5LJHQV-nm4F3djEL1481htlJlrE0hU",
  authDomain: "book-quiz-5cfec.firebaseapp.com",
  projectId: "book-quiz-5cfec",
  storageBucket: "book-quiz-5cfec.firebasestorage.app",
  messagingSenderId: "352729909403",
  appId: "1:352729909403:web:8cbc1b592995bc2fe91e3e",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_FIELD_BYTES = 900 * 1024; // Firestore 문서 1MB 제한 대비 여유

function sanitizeKey(key) {
  return String(key).replace(/[\/\s]/g, "_");
}

function byteLength(str) {
  return new TextEncoder().encode(str).length;
}

window.storage = {
  // value: JSON 문자열. 큰 필드(base64 그림/오디오 등)는 자동으로
  // 별도 Firestore 문서(key__필드명)로 분리 저장합니다.
  async set(key, value, shared) {
    const k = sanitizeKey(key);
    let parsed;
    try {
      parsed = JSON.parse(value);
    } catch (e) {
      parsed = value;
    }

    const external = [];
    const inline = {};

    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        if (typeof v === "string" && byteLength(v) > MAX_FIELD_BYTES) {
          throw new Error(
            "'" + field + "' 파일이 너무 커요 (약 " + Math.round(byteLength(v) / 1024) +
            "KB). 900KB 이하로 압축해서 다시 올려주세요."
          );
        }
      }
      // 문서 전체가 커지지 않도록, 필드 하나당 200KB 넘으면 별도 문서로 분리
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        if (typeof v === "string" && byteLength(v) > 200 * 1024) {
          external.push(field);
        } else {
          inline[field] = v;
        }
      }
    } else {
      inline.__raw = parsed;
    }

    // 별도 문서로 분리된 필드 저장
    for (const field of external) {
      await db.collection("kv").doc(k + "__" + field).set({
        value: parsed[field],
        updatedAt: Date.now(),
      });
    }

    // 매니페스트(본문) 문서 저장
    await db.collection("kv").doc(k).set({
      isManifest: true,
      value: JSON.stringify(inline),
      external: external,
      shared: !!shared,
      updatedAt: Date.now(),
    });

    // 호출한 쪽에서 바로 쓸 수 있도록 완전한 값을 재조합해서 반환
    const fullValue = parsed && typeof parsed === "object" && !Array.isArray(parsed)
      ? JSON.stringify(parsed)
      : value;
    return { key, value: fullValue, shared: !!shared };
  },

  async get(key, shared) {
    const k = sanitizeKey(key);
    const doc = await db.collection("kv").doc(k).get();
    if (!doc.exists) {
      throw new Error("not found: " + key);
    }
    const data = doc.data();
    let obj;
    try {
      obj = JSON.parse(data.value);
    } catch (e) {
      obj = data.value;
    }
    if (data.external && data.external.length && obj && typeof obj === "object") {
      for (const field of data.external) {
        try {
          const sub = await db.collection("kv").doc(k + "__" + field).get();
          if (sub.exists) obj[field] = sub.data().value;
        } catch (e) {}
      }
    }
    const finalValue = obj && typeof obj === "object" && obj.__raw !== undefined ? obj.__raw : JSON.stringify(obj);
    return { key, value: finalValue, shared: !!shared };
  },

  async delete(key, shared) {
    const k = sanitizeKey(key);
    try {
      const doc = await db.collection("kv").doc(k).get();
      if (doc.exists) {
        const data = doc.data();
        if (data.external && data.external.length) {
          for (const field of data.external) {
            await db.collection("kv").doc(k + "__" + field).delete().catch(() => {});
          }
        }
      }
    } catch (e) {}
    await db.collection("kv").doc(k).delete();
    return { key, deleted: true, shared: !!shared };
  },

  // prefix로 시작하는 "본문" 문서 ID들만 찾습니다 (분리 저장된 __필드 문서는 제외)
  async list(prefix, shared) {
    const p = sanitizeKey(prefix || "");
    let query = db.collection("kv");
    if (p) {
      query = query
        .where(firebase.firestore.FieldPath.documentId(), ">=", p)
        .where(firebase.firestore.FieldPath.documentId(), "<", p + "\uf8ff");
    }
    const snap = await query.get();
    const keys = [];
    snap.forEach((doc) => {
      if (doc.data().isManifest) keys.push(doc.id);
    });
    return { keys, prefix, shared: !!shared };
  },
};
</script>

s": "엑스레이", "defn": "An X-ray is a picture that shows the inside of the body, like the bones.", "example": "This X-ray shows the bones inside the hand."}, {"word": "xylophone", "gloss": "실로폰", "defn": "A xylophone is a musical instrument with bars that make sounds when hit with mallets.", "example": "This boy is hitting the bars of a xylophone."}, {"word": "yacht", "gloss": "요트", "defn": "A yacht is a large, fancy boat used for pleasure trips or racing.", "example": "This yacht is sailing across the calm sea."}, {"word": "yawn", "gloss": "하품하다", "defn": "To yawn means to open the mouth wide and breathe in deeply, often when tired.", "example": "This boy is yawning before bed."}, {"word": "year", "gloss": "해 (년)", "defn": "A year is the time it takes the Earth to travel around the sun, about 365 days.", "example": "This calendar shows all twelve months of the year."}, {"word": "yellow", "gloss": "노란", "defn": "Yellow is the color of a ripe banana or the sun.", "example": "This banana is bright yellow."}, {"word": "yesterday", "gloss": "어제", "defn": "Yesterday is the day before today.", "example": "This boy remembers that yesterday was sunny."}, {"word": "yoghurt", "gloss": "요구르트", "defn": "Yoghurt is a thick, creamy food made from milk.", "example": "This yoghurt is being scooped with a spoon."}, {"word": "zebra", "gloss": "얼룩말", "defn": "A zebra is an animal similar to a horse, with black and white stripes.", "example": "This zebra is grazing on the grass."}, {"word": "zero", "gloss": "0 (영)", "defn": "Zero is the number that means nothing or none.", "example": "This plate is empty, showing zero cookies left."}, {"word": "zip", "gloss": "지퍼를 잠그다", "defn": "To zip means to close something using a zipper.", "example": "This girl is zipping up her jacket."}, {"word": "zoo", "gloss": "동물원", "defn": "A zoo is a place where wild animals are kept for people to see.", "example": "This zoo has lions, elephants, and monkeys."}, {"word": "zookeeper", "gloss": "사육사", "defn": "A zookeeper is a person whose job is to take care of animals in a zoo.", "example": "This zookeeper is feeding the elephants."}];
const ROUND_SIZE = 10;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function SpellingGame() {
  const [media, setMedia] = useState({});
  const [phase, setPhase] = useState("loading");
  const [questions, setQuestions] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [letters, setLetters] = useState([]);
  const [result, setResult] = useState(null); // null | "correct" | "wrong"
  const [correctCount, setCorrectCount] = useState(0);
  const inputRefs = useRef([]);
  const audioRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const keysRes = await window.storage.list("media:", false);
        if (keysRes && keysRes.keys) {
          const obj = {};
          for (const k of keysRes.keys) {
            try {
              const r = await window.storage.get(k, false);
              if (r && r.value) obj[k.replace("media:", "")] = JSON.parse(r.value);
            } catch (e) {}
          }
          setMedia(obj);
        }
      } catch (e) {}
      startRound();
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const startRound = useCallback(() => {
    const pool = shuffle(SAMPLE_WORDS).slice(0, ROUND_SIZE);
    setQuestions(pool);
    setQIndex(0);
    setCorrectCount(0);
    setPhase("playing");
  }, []);

  const currentWord = questions[qIndex];

  useEffect(() => {
    if (currentWord) {
      setLetters(new Array(currentWord.word.length).fill(""));
      setResult(null);
      inputRefs.current = [];
    }
  }, [currentWord]);

  const speak = useCallback((text, onend) => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      u.onend = onend;
      u.onerror = onend;
      window.speechSynthesis.speak(u);
    } catch (e) { onend && onend(); }
  }, []);

  const playWord = useCallback(() => {
    if (!currentWord) return;
    const m = media[currentWord.word] || {};
    try { window.speechSynthesis.cancel(); } catch (e) {}
    if (audioRef.current) audioRef.current.pause();
    if (m.wordAudio) {
      const a = new Audio(m.wordAudio);
      audioRef.current = a;
      a.onerror = () => speak(currentWord.word);
      a.play().catch(() => speak(currentWord.word));
    } else {
      speak(currentWord.word);
    }
  }, [currentWord, media, speak]);

  useEffect(() => {
    if (phase === "playing" && currentWord) {
      const t = setTimeout(() => playWord(), 350);
      return () => clearTimeout(t);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [qIndex, phase]);

  const handleLetterChange = (i, val) => {
    if (result) return;
    const ch = val.slice(-1);
    const next = [...letters];
    next[i] = ch;
    setLetters(next);
    if (ch && i < letters.length - 1) {
      inputRefs.current[i + 1]?.focus();
    }
    if (ch && i === letters.length - 1) {
      checkAnswer(next);
    }
  };

  const handleKeyDown = (i, e) => {
    if (e.key === "Backspace" && !letters[i] && i > 0) {
      inputRefs.current[i - 1]?.focus();
    }
    if (e.key === "Enter") checkAnswer(letters);
  };

  const checkAnswer = (arr) => {
    const guess = arr.join("").toLowerCase();
    const correct = guess === currentWord.word.toLowerCase();
    setResult(correct ? "correct" : "wrong");
    if (correct) setCorrectCount((c) => c + 1);
  };

  const nextQuestion = () => {
    if (qIndex + 1 >= questions.length) {
      setPhase("result");
    } else {
      setQIndex((i) => i + 1);
    }
  };

  useEffect(() => {
    if (phase === "playing" && letters.length && !result) {
      inputRefs.current[0]?.focus();
    }
  }, [letters, phase, result]);

  if (phase === "loading" || !currentWord) {
    return (
      <div className="w-full h-screen flex items-center justify-center" style={{ background: "#0F1B2D" }}>
        <p className="text-white text-sm">불러오는 중...</p>
      </div>
    );
  }

  if (phase === "result") {
    const pct = Math.round((correctCount / questions.length) * 100);
    return (
      <div className="w-full h-screen flex flex-col items-center justify-center gap-5 px-6" style={{ background: "#0F1B2D" }}>
        <Trophy size={48} style={{ color: "#D9A441" }} />
        <h1 className="text-white font-serif text-2xl font-bold">결과</h1>
        <p className="text-5xl font-extrabold" style={{ color: "#8FD19E" }}>{correctCount} / {questions.length}</p>
        <p className="text-sm" style={{ color: "#B7C6DA" }}>정답률 {pct}%</p>
        <button onClick={startRound} className="flex items-center gap-2 mt-4 px-6 py-3 rounded-full font-medium text-sm" style={{ background: "#D9A441", color: "#1E3A5F" }}>
          <RotateCcw size={16} /> 다시 하기
        </button>
      </div>
    );
  }

  const m = media[currentWord.word] || {};

  return (
    <div className="w-full h-screen flex flex-col" style={{ background: "#FBF7EF" }}>
      <div className="flex items-center justify-between px-5 py-4" style={{ background: "#1E3A5F" }}>
        <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: "#D9A441" }}>
          <Home size={17} style={{ color: "#1E3A5F" }} />
        </div>
        <h1 className="text-white font-serif text-base font-bold">Spelling Game</h1>
        <span className="text-white text-sm font-mono">{qIndex + 1} / {questions.length}</span>
      </div>

      <div className="h-1.5 w-full" style={{ background: "#EAE2CE" }}>
        <div className="h-full transition-all" style={{ width: (qIndex / questions.length) * 100 + "%", background: "#D9A441" }} />
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 py-4 gap-6">
        <div className="rounded-2xl overflow-hidden shadow-md" style={{ width: "min(38vh, 220px)", height: "min(38vh, 220px)", background: "#F3EEE0", border: "1px solid #EAE2CE" }}>
          {m.image ? (
            <div className="w-full h-full" style={{ backgroundImage: "url(" + m.image + ")", backgroundSize: "400% 100%", backgroundPosition: "0% 0" }} />
          ) : (
            <div className="w-full h-full flex items-center justify-center text-xs" style={{ color: "#C9BF9F" }}>이미지 없음</div>
          )}
        </div>

        <button onClick={playWord} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium" style={{ background: "#1E3A5F", color: "white" }}>
          <Volume2 size={16} /> 단어 다시 듣기
        </button>

        {/* Spelling Game 입력박스 */}
        <div className="flex gap-2 flex-wrap justify-center max-w-lg">
          {letters.map((ch, i) => {
            let border = "#D8CDB0", bg = "white", color = "#1E3A5F";
            if (result === "correct") { border = "#8FD19E"; bg = "#E7F3E9"; color = "#2E6B3E"; }
            else if (result === "wrong") { border = "#E2A093"; bg = "#FBEAE6"; color = "#B0402C"; }
            return (
              <input
                key={i}
                ref={(el) => (inputRefs.current[i] = el)}
                value={ch}
                onChange={(e) => handleLetterChange(i, e.target.value)}
                onKeyDown={(e) => handleKeyDown(i, e)}
                disabled={!!result}
                maxLength={1}
                className="w-10 h-12 text-center rounded-lg border-2 font-serif text-xl font-bold outline-none"
                style={{ borderColor: border, background: bg, color }}
                autoCapitalize="off"
                autoCorrect="off"
              />
            );
          })}
        </div>

        {result === "wrong" && (
          <p className="text-sm" style={{ color: "#B0402C" }}>
            정답: <b className="font-serif">{currentWord.word}</b>
          </p>
        )}

        {result ? (
          <button onClick={nextQuestion} className="flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-medium" style={{ background: "#D9A441", color: "#1E3A5F" }}>
            다음 <ArrowRight size={16} />
          </button>
        ) : (
          <button onClick={() => checkAnswer(letters)} className="flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-medium" style={{ background: "#1E3A5F", color: "white" }}>
            확인
          </button>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SpellingGame />);
</script>
</body>
</html>
