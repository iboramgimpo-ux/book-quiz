<script>
// ============================================================
// firebase-storage.js
// 1200 Word Dictionary - Firebase 연동 공용 스크립트 (Firestore만 사용, 무료)
//
// Storage(유료 Blaze 필요) 대신, 그림/오디오도 전부 Firestore에 직접 저장합니다.
// Firestore 문서는 1개당 1MB 제한이 있어서, 큰 필드(그림/오디오)는 자동으로
// 별도 문서에 나눠 저장하고 불러올 때 다시 합칩니다. 그래도 필드 하나가
// 900KB를 넘으면 저장이 안 되니, 그럴 땐 파일을 더 압축해서 올려주세요.
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCPa5LJHQV-nm4F3djEL1481htlJlrE0hU",
  authDomain: "book-quiz-5cfec.firebaseapp.com",
  projectId: "book-quiz-5cfec",
  storageBucket: "book-quiz-5cfec.firebasestorage.app",
  messagingSenderId: "352729909403",
  appId: "1:352729909403:web:8cbc1b592995bc2fe91e3e",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_FIELD_BYTES = 900 * 1024; // Firestore 문서 1MB 제한 대비 여유

function sanitizeKey(key) {
  return String(key).replace(/[\/\s]/g, "_");
}

function byteLength(str) {
  return new TextEncoder().encode(str).length;
}

window.storage = {
  // value: JSON 문자열. 큰 필드(base64 그림/오디오 등)는 자동으로
  // 별도 Firestore 문서(key__필드명)로 분리 저장합니다.
  async set(key, value, shared) {
    const k = sanitizeKey(key);
    let parsed;
    try {
      parsed = JSON.parse(value);
    } catch (e) {
      parsed = value;
    }

    const external = [];
    const inline = {};

    // 문자열 필드뿐 아니라 배열 필드(효과음 여러 개 등)도 실제 바이트 크기를 계산합니다.
    // (예전 코드는 typeof v === "string"만 검사해서, 효과음 배열처럼 배열에 담긴
    //  큰 데이터는 크기 검사도, 분리 저장도 되지 않고 무조건 본문에 합쳐져서
    //  Firestore 문서 1MB 제한을 넘기면 저장이 조용히 실패하는 원인이었습니다.)
    function fieldByteLength(v) {
      if (typeof v === "string") return byteLength(v);
      if (Array.isArray(v)) return byteLength(JSON.stringify(v));
      return 0;
    }

    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        const size = fieldByteLength(v);
        if (size > MAX_FIELD_BYTES) {
          throw new Error(
            "'" + field + "' 파일이 너무 커요 (약 " + Math.round(size / 1024) +
            "KB). 900KB 이하로 압축해서 다시 올려주세요."
          );
        }
      }
      // 문서 전체가 커지지 않도록, 필드 하나당 200KB 넘으면 별도 문서로 분리
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        if (fieldByteLength(v) > 200 * 1024) {
          external.push(field);
        } else {
          inline[field] = v;
        }
      }
    } else {
      inline.__raw = parsed;
    }

    // 본문(매니페스트) 문서에 들어갈 inline 데이터 전체 합계도 확인합니다.
    // 필드 하나하나는 200KB 미만이라도, 여러 개를 합치면 Firestore 문서
    // 1MB 제한을 넘을 수 있는데, 그러면 이 문서에 들어있는 다른 모든 정보
    // (이미지, 발음, 정의음성 등)까지 통째로 저장이 실패합니다.
    const inlineSize = byteLength(JSON.stringify(inline));
    if (inlineSize > 850 * 1024) {
      throw new Error(
        "이 항목의 전체 데이터가 너무 커요 (약 " + Math.round(inlineSize / 1024) +
        "KB). 이미지나 소리 파일 용량을 줄이거나 개수를 줄여서 다시 시도해주세요."
      );
    }

    // 별도 문서로 분리된 필드 저장
    for (const field of external) {
      await db.collection("kv").doc(k + "__" + field).set({
        value: parsed[field],
        updatedAt: Date.now(),
      });
    }

    // 매니페스트(본문) 문서 저장
    await db.collection("kv").doc(k).set({
      isManifest: true,
      value: JSON.stringify(inline),
      external: external,
      shared: !!shared,
      updatedAt: Date.now(),
    });

    // ⚠️ 실제로 서버에 저장됐는지 확인합니다.
    // Firestore는 오프라인 캐시에 먼저 쓰고 나중에 서버와 동기화하기 때문에,
    // 네트워크가 불안정하거나 보안 규칙(rules)이 쓰기를 막는 경우에도
    // 위의 set() 자체는 에러 없이 "성공한 것처럼" 끝나버릴 수 있습니다.
    // (바로 이게 "저장됐다고 나오는데 사진/소리가 사라진다"는 증상의 원인입니다.)
    // { source: "server" }로 캐시를 건너뛰고 서버에서 직접 다시 읽어 확인합니다.
    // ⚠️ 예전 코드는 "본문(매니페스트)" 문서만 확인했습니다. 그림·음성처럼 큰 파일은
    // 별도 문서(k + "__" + field)로 분리 저장되는데, 그 문서가 실제로 서버에
    // 저장됐는지는 확인하지 않아서 "저장 완료"라고 뜨는데도 그림/음성만 빠지는
    // 문제가 있었습니다. 이제 분리된 문서까지 전부 서버에서 다시 읽어 확인합니다.
    try {
      const verifyDoc = await db.collection("kv").doc(k).get({ source: "server" });
      if (!verifyDoc.exists) {
        throw new Error("문서가 서버에 저장되지 않았어요.");
      }
      for (const field of external) {
        const verifySub = await db.collection("kv").doc(k + "__" + field).get({ source: "server" });
        if (!verifySub.exists) {
          throw new Error("'" + field + "' 파일이 서버에 저장되지 않았어요.");
        }
      }
    } catch (verifyErr) {
      throw new Error(
        "저장이 서버에 반영되지 않았어요 (" +
        (verifyErr && verifyErr.message ? verifyErr.message : "확인 실패") +
        "). 인터넷 연결을 확인한 뒤 다시 저장해주세요."
      );
    }

    // 호출한 쪽에서 바로 쓸 수 있도록 완전한 값을 재조합해서 반환
    const fullValue = parsed && typeof parsed === "object" && !Array.isArray(parsed)
      ? JSON.stringify(parsed)
      : value;
    return { key, value: fullValue, shared: !!shared };
  },

  async get(key, shared) {
    const k = sanitizeKey(key);
    // 항상 서버에서 최신 값을 먼저 시도합니다. (학생 화면에 수정 전 텍스트가
    // 남아있던 문제는 오래된 캐시를 읽어서 생기는 경우가 많아, 캐시보다 서버를
    // 우선하도록 했습니다. 완전히 오프라인일 때만 캐시로 대체합니다.)
    let doc;
    try {
      doc = await db.collection("kv").doc(k).get({ source: "server" });
    } catch (e) {
      doc = await db.collection("kv").doc(k).get();
    }
    if (!doc.exists) {
      throw new Error("not found: " + key);
    }
    const data = doc.data();
    let obj;
    try {
      obj = JSON.parse(data.value);
    } catch (e) {
      obj = data.value;
    }
    if (data.external && data.external.length && obj && typeof obj === "object") {
      // ⚠️ 예전 코드는 분리 문서를 못 읽어와도 catch(e){}로 조용히 무시해서,
      // 그림/음성이 서버에 있든 없든 아무 표시 없이 그냥 빠진 채로 반환됐습니다.
      // 이제 서버에서 우선 읽고(source:"server"), 실패하면 콘솔에 경고를 남깁니다.
      const missingFields = [];
      for (const field of data.external) {
        let sub = null;
        try {
          sub = await db.collection("kv").doc(k + "__" + field).get({ source: "server" });
        } catch (e) {
          try {
            sub = await db.collection("kv").doc(k + "__" + field).get();
          } catch (e2) {
            missingFields.push(field);
            continue;
          }
        }
        if (sub && sub.exists) {
          obj[field] = sub.data().value;
        } else {
          missingFields.push(field);
        }
      }
      if (missingFields.length) {
        console.warn("[storage.get] '" + key + "'의 다음 필드를 서버에서 찾지 못했습니다: " + missingFields.join(", "));
      }
    }
    const finalValue = obj && typeof obj === "object" && obj.__raw !== undefined ? obj.__raw : JSON.stringify(obj);
    return { key, value: finalValue, shared: !!shared };
  },

  async delete(key, shared) {
    const k = sanitizeKey(key);
    try {
      const doc = await db.collection("kv").doc(k).get();
      if (doc.exists) {
        const data = doc.data();
        if (data.external && data.external.length) {
          for (const field of data.external) {
            await db.collection("kv").doc(k + "__" + field).delete().catch(() => {});
          }
        }
      }
    } catch (e) {}
    await db.collection("kv").doc(k).delete();
    return { key, deleted: true, shared: !!shared };
  },

  // prefix로 시작하는 "본문" 문서 ID들만 찾습니다 (분리 저장된 __필드 문서는 제외)
  async list(prefix, shared) {
    const p = sanitizeKey(prefix || "");
    let query = db.collection("kv");
    if (p) {
      query = query
        .where(firebase.firestore.FieldPath.documentId(), ">=", p)
        .where(firebase.firestore.FieldPath.documentId(), "<", p + "\uf8ff");
    }
    const snap = await query.get();
    const keys = [];
    snap.forEach((doc) => {
      if (doc.data().isManifest) keys.push(doc.id);
    });
    return { keys, prefix, shared: !!shared };
  },
};
</script>

// ---------- 전체 1200단어 데이터 (내장) ----------
// ALL_WORDS는 words.json에서 fetch로 불러옵니다 (학생 화면과 같은 파일을 공유해 두 화면의 기본 단어 데이터가 어긋나지 않도록 함)

const DEFAULT_DURATION = 1.6;

function AdminUploadTool() {
  const [deletedWords, setDeletedWords] = useState([]);
  const [addedWords, setAddedWords] = useState([]);
  const [wordEdits, setWordEdits] = useState({}); // word -> { gloss, defn, example } 수정 내용
  const [media, setMedia] = useState({});
  const [activeLetter, setActiveLetter] = useState("A");
  const [query, setQuery] = useState("");
  const [selectedWord, setSelectedWord] = useState(null);
  const [previewPlaying, setPreviewPlaying] = useState(false);
  const [status, setStatus] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [showAddForm, setShowAddForm] = useState(false);
  const [newWordForm, setNewWordForm] = useState({ word: "", gloss: "", defn: "", example: "" });
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [mainTab, setMainTab] = useState("words"); // words | students
  const [baseWords, setBaseWords] = useState(null); // words.json에서 비동기로 불러옵니다 (학생 화면과 공유되는 기본 데이터)

  useEffect(() => {
    fetch("words.json")
      .then((res) => res.json())
      .then((data) => setBaseWords(data))
      .catch(() => setBaseWords([]));
  }, []);

  const applyEdit = (w) => {
    const e = wordEdits[w.word];
    return e ? { ...w, ...e } : w;
  };

  const words = useMemo(() => {
    if (!baseWords) return [];
    const deletedSet = new Set(deletedWords);
    const base = baseWords.filter((w) => !deletedSet.has(w.word)).map(applyEdit);
    const addedFiltered = addedWords.filter((w) => !deletedSet.has(w.word)).map(applyEdit);
    return [...base, ...addedFiltered];
  }, [baseWords, deletedWords, addedWords, wordEdits]);

  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  useEffect(() => {
    (async () => {
      try {
        const keysRes = await window.storage.list("media:", true);
        if (keysRes && keysRes.keys && keysRes.keys.length) {
          const mediaObj = {};
          for (const k of keysRes.keys) {
            try {
              const r = await window.storage.get(k, true);
              if (r && r.value) {
                const w = k.replace("media:", "");
                mediaObj[w] = JSON.parse(r.value);
              }
            } catch (e) {}
          }
          setMedia(mediaObj);
        }
      } catch (e) {}
      try {
        const del = await window.storage.get("deleted-words", true);
        if (del && del.value) setDeletedWords(JSON.parse(del.value));
      } catch (e) {}
      try {
        const add = await window.storage.get("added-words", true);
        if (add && add.value) setAddedWords(JSON.parse(add.value));
      } catch (e) {}
      try {
        const edits = await window.storage.get("word-edits", true);
        if (edits && edits.value) setWordEdits(JSON.parse(edits.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const handleDeleteWord = async (word) => {
    const next = [...deletedWords, word];
    setDeletedWords(next);
    setConfirmDelete(null);
    if (selectedWord && selectedWord.word === word) setSelectedWord(null);
    try {
      await window.storage.set("deleted-words", JSON.stringify(next), true);
      flash(word + " 삭제됨");
    } catch (e) {
      flash("삭제 저장 실패", true);
    }
  };

  const handleAddWord = async () => {
    const w = newWordForm.word.trim();
    if (!w) { flash("단어를 입력해주세요"); return; }
    if (words.some((x) => x.word.toLowerCase() === w.toLowerCase())) {
      flash("이미 목록에 있는 단어예요");
      return;
    }
    const entry = {
      word: w,
      gloss: newWordForm.gloss.trim() || "-",
      defn: newWordForm.defn.trim() || "(정의를 입력해주세요)",
      example: newWordForm.example.trim() || "(예문을 입력해주세요)",
    };
    const next = [...addedWords, entry];
    setAddedWords(next);
    try {
      await window.storage.set("added-words", JSON.stringify(next), true);
      flash(w + " 추가됨");
      setNewWordForm({ word: "", gloss: "", defn: "", example: "" });
      setShowAddForm(false);
      setActiveLetter(w[0].toUpperCase());
      setQuery("");
    } catch (e) {
      flash("추가 저장 실패", true);
    }
  };

  const filteredWords = useMemo(() => {
    let list = words;
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter((w) => w.word.toLowerCase().includes(q));
    } else {
      list = list.filter((w) => w.word[0].toUpperCase() === activeLetter);
    }
    return list;
  }, [words, activeLetter, query]);

  const stats = useMemo(() => {
    const total = words.length;
    let img = 0, aud = 0;
    words.forEach((w) => {
      const m = media[w.word];
      if (m && m.image) img++;
      if (m && m.definitionAudio) aud++;
    });
    return { total, img, aud };
  }, [words, media]);

  const flash = (msg, isError) => {
    setStatus(msg);
    if (!isError) {
      setTimeout(() => setStatus(""), 2200);
    }
  };

  const readFileAsDataUrl = (file) =>
    new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("read failed"));
      reader.readAsDataURL(file);
    });

  // ---- 이미지 자동 압축 (업로드 용량이 크면 자동으로 900KB 이하로 낮춤) ----
  const MAX_IMAGE_BYTES = 900 * 1024;

  const compressImageFile = (file, maxBytes = MAX_IMAGE_BYTES) =>
    new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new window.Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const renderAt = (w, h) => {
          canvas.width = w;
          canvas.height = h;
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
        };

        const toBlobAt = (w, h, quality) =>
          new Promise((res) => {
            renderAt(w, h);
            canvas.toBlob((blob) => res(blob), "image/jpeg", quality);
          });

        (async () => {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          let quality = 0.9;
          let blob = await toBlobAt(w, h, quality);

          // 1) 품질을 낮춰가며 용량을 줄여본다
          while (blob && blob.size > maxBytes && quality > 0.35) {
            quality -= 0.1;
            blob = await toBlobAt(w, h, quality);
          }

          // 2) 그래도 크면 가로/세로를 단계적으로 줄여가며 다시 시도한다
          let guard = 0;
          while (blob && blob.size > maxBytes && w > 300 && h > 300 && guard < 12) {
            w = Math.round(w * 0.85);
            h = Math.round(h * 0.85);
            quality = 0.85;
            blob = await toBlobAt(w, h, quality);
            let q2 = quality;
            while (blob && blob.size > maxBytes && q2 > 0.35) {
              q2 -= 0.1;
              blob = await toBlobAt(w, h, q2);
            }
            guard++;
          }

          if (!blob) { reject(new Error("compress failed")); return; }
          resolve(blob);
        })();
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("image load failed"));
      };
      img.src = url;
    });

  // ---- 전체 다운로드 (그림 / 효과음 / 엑셀) ----
  const [bulkDownloading, setBulkDownloading] = useState(""); // "" | "images" | "sounds" | "excel"

  const dataUrlExt = (dataUrl, fallback) => {
    const m = /^data:[^;]+\/([a-zA-Z0-9.+-]+);base64,/.exec(dataUrl || "");
    if (!m) return fallback;
    let ext = m[1].toLowerCase();
    if (ext === "jpeg") ext = "jpg";
    if (ext === "mpeg") ext = "mp3";
    return ext;
  };

  const sanitizeFileName = (s) => String(s).replace(/[\\/:*?"<>|]/g, "_");

  const dataUrlToArrayBuffer = (dataUrl) => {
    const base64 = dataUrl.split(",")[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  };

  // 효과음 여러 개를 하나의 모노 PCM(Float32)으로 순서대로 이어붙입니다.
  const concatToMonoFloat32 = async (dataUrls, audioCtx) => {
    const buffers = [];
    let totalLength = 0;
    for (const url of dataUrls) {
      const arrBuf = dataUrlToArrayBuffer(url);
      const audioBuffer = await audioCtx.decodeAudioData(arrBuf);
      buffers.push(audioBuffer);
      totalLength += audioBuffer.length;
    }
    const result = new Float32Array(totalLength);
    let offset = 0;
    for (const buf of buffers) {
      let channelData;
      if (buf.numberOfChannels > 1) {
        channelData = new Float32Array(buf.length);
        for (let ch = 0; ch < buf.numberOfChannels; ch++) {
          const data = buf.getChannelData(ch);
          for (let i = 0; i < buf.length; i++) channelData[i] += data[i] / buf.numberOfChannels;
        }
      } else {
        channelData = buf.getChannelData(0);
      }
      result.set(channelData, offset);
      offset += channelData.length;
    }
    return result;
  };

  const floatTo16BitPCM = (samples) => {
    const out = new Int16Array(samples.length);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  };

  const encodeMp3 = (int16Samples, sampleRate) => {
    const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
    const blockSize = 1152;
    const mp3Data = [];
    for (let i = 0; i < int16Samples.length; i += blockSize) {
      const chunk = int16Samples.subarray(i, i + blockSize);
      const buf = mp3encoder.encodeBuffer(chunk);
      if (buf.length > 0) mp3Data.push(buf);
    }
    const end = mp3encoder.flush();
    if (end.length > 0) mp3Data.push(end);
    return new Blob(mp3Data, { type: "audio/mp3" });
  };

  // 효과음(최대 4개)을 재생 순서 그대로 이어붙여 하나의 mp3 파일로 만듭니다.
  const combineEffectsToMp3 = async (dataUrls) => {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContextClass();
    try {
      const floatSamples = await concatToMonoFloat32(dataUrls, audioCtx);
      const int16 = floatTo16BitPCM(floatSamples);
      return encodeMp3(int16, audioCtx.sampleRate);
    } finally {
      audioCtx.close();
    }
  };

  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };

  const handleDownloadAllImages = async () => {
    if (bulkDownloading) return;
    setBulkDownloading("images");
    try {
      const zip = new JSZip();
      let count = 0;
      for (const w of words) {
        const m = media[w.word];
        if (m && m.image) {
          const ext = dataUrlExt(m.image, "png");
          zip.file(sanitizeFileName(w.word) + "." + ext, m.image.split(",")[1], { base64: true });
          count++;
        }
      }
      if (count === 0) { flash("업로드된 그림이 없어요", true); setBulkDownloading(""); return; }
      const blob = await zip.generateAsync({ type: "blob" });
      downloadBlob(blob, "word-images.zip");
      flash(count + "개 그림 다운로드 완료");
    } catch (e) {
      console.error(e);
      flash("그림 다운로드 중 오류가 발생했어요", true);
    }
    setBulkDownloading("");
  };

  const handleDownloadAllSounds = async () => {
    if (bulkDownloading) return;
    setBulkDownloading("sounds");
    try {
      const zip = new JSZip();
      let count = 0;
      for (const w of words) {
        const m = media[w.word];
        if (!m) continue;
        if (m.wordAudio) {
          zip.file(sanitizeFileName(w.word) + "_word." + dataUrlExt(m.wordAudio, "mp3"), m.wordAudio.split(",")[1], { base64: true });
          count++;
        }
        if (m.definitionAudio) {
          zip.file(sanitizeFileName(w.word) + "_definition." + dataUrlExt(m.definitionAudio, "mp3"), m.definitionAudio.split(",")[1], { base64: true });
          count++;
        }
        const effects = (m.soundEffects || []).filter(Boolean);
        if (effects.length > 0) {
          // 애니메이션 재생 시 순서대로 이어지는 효과음이므로, 하나의 mp3로 합쳐서 담아요.
          const mp3Blob = await combineEffectsToMp3(effects);
          zip.file(sanitizeFileName(w.word) + "_effects.mp3", mp3Blob);
          count++;
        }
      }
      if (count === 0) { flash("업로드된 효과음/오디오가 없어요", true); setBulkDownloading(""); return; }
      const blob = await zip.generateAsync({ type: "blob" });
      downloadBlob(blob, "word-sounds.zip");
      flash(count + "개 오디오 다운로드 완료");
    } catch (e) {
      console.error(e);
      flash("효과음 다운로드 중 오류가 발생했어요", true);
    }
    setBulkDownloading("");
  };

  const handleDownloadExcel = () => {
    if (bulkDownloading) return;
    setBulkDownloading("excel");
    try {
      const rows = words.map((w) => ({
        단어: w.word,
        한글뜻: w.gloss,
        사전적정의: w.defn,
        예문: w.example,
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [{ wch: 18 }, { wch: 20 }, { wch: 55 }, { wch: 55 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "1200단어");
      XLSX.writeFile(wb, "1200-words.xlsx");
      flash(words.length + "개 단어 엑셀 다운로드 완료");
    } catch (e) {
      console.error(e);
      flash("엑셀 다운로드 중 오류가 발생했어요", true);
    }
    setBulkDownloading("");
  };

  // ---- 선택된 단어의 "임시 편집 상태" (아직 저장 안 된 변경사항) ----
  const [pendingMedia, setPendingMedia] = useState({ duration: DEFAULT_DURATION });
  const [pendingFields, setPendingFields] = useState({ gloss: "", defn: "", example: "" });
  const [saving, setSaving] = useState(false);
  const [saveResult, setSaveResult] = useState(null); // null | "success" | "error"
  const [saveErrorMsg, setSaveErrorMsg] = useState("");

  useEffect(() => {
    if (selectedWord) {
      setPendingMedia(media[selectedWord.word] || { duration: DEFAULT_DURATION });
      setPendingFields({
        gloss: selectedWord.gloss || "",
        defn: selectedWord.defn || "",
        example: selectedWord.example || "",
      });
      setSaveResult(null);
      setSaveErrorMsg("");
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedWord]);

  const isDirty = selectedWord
    ? JSON.stringify(pendingMedia) !== JSON.stringify(media[selectedWord.word] || { duration: DEFAULT_DURATION }) ||
      pendingFields.gloss !== (selectedWord.gloss || "") ||
      pendingFields.defn !== (selectedWord.defn || "") ||
      pendingFields.example !== (selectedWord.example || "")
    : false;

  const handleFieldChange = (field, value) => {
    setPendingFields((prev) => ({ ...prev, [field]: value }));
    setSaveResult(null);
  };

  // ---- 효과음 (최대 4개, 순서대로 재생) ----
  const MAX_EFFECTS = 4;
  const handleAddSoundEffect = async (file) => {
    if (!file) return;
    const current = pendingMedia.soundEffects || [];
    if (current.length >= MAX_EFFECTS) { flash(`효과음은 최대 ${MAX_EFFECTS}개까지 올릴 수 있어요`, true); return; }
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, soundEffects: [...(prev.soundEffects || []), dataUrl] }));
      setSaveResult(null);
    } catch (e) {
      flash("효과음을 읽지 못했어요", true);
    }
  };
  const handleRemoveSoundEffect = (idx) => {
    setPendingMedia((prev) => ({
      ...prev,
      soundEffects: (prev.soundEffects || []).filter((_, i) => i !== idx),
    }));
    setSaveResult(null);
  };

  const handleImageUpload = async (file) => {
    if (!file) return;
    try {
      let toRead = file;
      let compressedNote = "";

      if (file.size > MAX_IMAGE_BYTES) {
        try {
          const compressedBlob = await compressImageFile(file);
          if (compressedBlob && compressedBlob.size < file.size) {
            toRead = compressedBlob;
            compressedNote = `그림 용량을 ${Math.round(file.size / 1024)}KB → ${Math.round(compressedBlob.size / 1024)}KB로 자동으로 줄였어요`;
          }
        } catch (compressErr) {
          // 압축에 실패하면 원본 그대로 업로드를 시도한다
        }
      }

      const dataUrl = await readFileAsDataUrl(toRead);
      setPendingMedia((prev) => ({ ...prev, image: dataUrl }));
      setSaveResult(null);
      if (compressedNote) flash(compressedNote, false);
    } catch (e) {
      flash("그림을 읽지 못했어요", true);
    }
  };

  const handleWordAudioUpload = async (file) => {
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, wordAudio: dataUrl }));
      setSaveResult(null);
    } catch (e) {
      flash("오디오를 읽지 못했어요", true);
    }
  };

  const handleDefinitionAudioUpload = async (file) => {
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, definitionAudio: dataUrl }));
      setSaveResult(null);
    } catch (e) {
      flash("오디오를 읽지 못했어요", true);
    }
  };

  const handleDurationChange = (value) => {
    setPendingMedia((prev) => ({ ...prev, duration: value }));
  };

  const saveSelected = async () => {
    if (!selectedWord) return;
    setSaving(true);
    setSaveResult(null);
    try {
      const res = await window.storage.set("media:" + selectedWord.word, JSON.stringify(pendingMedia), true);
      if (res && res.value) {
        const savedValue = JSON.parse(res.value); // Storage 업로드 후 실제 URL로 치환된 값
        setMedia((prev) => ({ ...prev, [selectedWord.word]: savedValue }));
        setPendingMedia(savedValue);
      } else {
        setSaveResult("error");
        setSaveErrorMsg("저장에 실패했어요. Firebase Storage 규칙(rules)이 쓰기를 막고 있을 수 있어요.");
        setSaving(false);
        return;
      }

      // 뜻/정의/예문이 바뀌었다면 word-edits에 함께 저장
      const fieldsChanged =
        pendingFields.gloss !== (selectedWord.gloss || "") ||
        pendingFields.defn !== (selectedWord.defn || "") ||
        pendingFields.example !== (selectedWord.example || "");
      if (fieldsChanged) {
        const nextEdits = {
          ...wordEdits,
          [selectedWord.word]: {
            gloss: pendingFields.gloss.trim() || "-",
            defn: pendingFields.defn.trim() || "(정의를 입력해주세요)",
            example: pendingFields.example.trim() || "(예문을 입력해주세요)",
          },
        };
        await window.storage.set("word-edits", JSON.stringify(nextEdits), true);
        setWordEdits(nextEdits);
        setSelectedWord((prev) => (prev ? { ...prev, ...nextEdits[selectedWord.word] } : prev));
      }

      setSaveResult("success");
    } catch (e) {
      console.error(e);
      setSaveResult("error");
      setSaveErrorMsg("저장 중 오류: " + (e && e.message ? e.message : String(e)));
    }
    setSaving(false);
  };

  useEffect(() => {
    if (!selectedWord) return;
    setPreviewPlaying(false);
  }, [selectedWord]);

  const togglePreview = () => setPreviewPlaying((p) => !p);

  const selectedMedia = pendingMedia;
  const duration = selectedMedia.duration || DEFAULT_DURATION;

  return (
    <div className="min-h-screen" style={{ background: "#FBF7EF", fontFamily: "ui-sans-serif, system-ui" }}>
      <header className="sticky top-0 z-20 border-b" style={{ background: "#1E3A5F", borderColor: "#14283F" }}>
        <div className="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center text-lg font-bold" style={{ background: "#D9A441", color: "#1E3A5F" }}>
              📖
            </div>
            <div>
              <h1 className="text-white font-serif text-xl tracking-tight leading-none">1200 Word Dictionary</h1>
              <p className="text-xs" style={{ color: "#B7C6DA" }}>관리자 업로드 도구</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden sm:flex items-center gap-4 text-sm">
              <span style={{ color: "#B7C6DA" }}>그림 <b className="text-white">{stats.img}</b>/{stats.total}</span>
              <span style={{ color: "#B7C6DA" }}>풀이음성 <b className="text-white">{stats.aud}</b>/{stats.total}</span>
            </div>
            <button
              onClick={() => setShowAddForm(true)}
              className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition"
              style={{ background: "#D9A441", color: "#1E3A5F" }}
            >
              <Plus size={16} /> 단어 추가
            </button>
          </div>
        </div>
      </header>

      <div className="max-w-6xl mx-auto px-5 pt-4 flex gap-2">
        <button
          onClick={() => setMainTab("words")}
          className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
          style={{ color: mainTab === "words" ? "#1E3A5F" : "#8A7F68", borderColor: mainTab === "words" ? "#D9A441" : "transparent", background: mainTab === "words" ? "white" : "transparent" }}
        >
          단어 관리
        </button>
        <button
          onClick={() => setMainTab("students")}
          className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
          style={{ color: mainTab === "students" ? "#1E3A5F" : "#8A7F68", borderColor: mainTab === "students" ? "#D9A441" : "transparent", background: mainTab === "students" ? "white" : "transparent" }}
        >
          학생 링크
        </button>
        <button
          onClick={() => setMainTab("bulk")}
          className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
          style={{ color: mainTab === "bulk" ? "#1E3A5F" : "#8A7F68", borderColor: mainTab === "bulk" ? "#D9A441" : "transparent", background: mainTab === "bulk" ? "white" : "transparent" }}
        >
          단어소리/영영풀이 일괄 업로드
        </button>
      </div>

      {mainTab === "students" && <StudentLinksPanel />}
      {mainTab === "bulk" && <BulkZipUploadPanel allWords={words} />}

      {mainTab === "words" && (
      <>
      <div className="sm:hidden px-5 py-2 text-xs flex gap-4" style={{ color: "#5B6B7F" }}>
        <span>그림 {stats.img}/{stats.total}</span>
        <span>풀이음성 {stats.aud}/{stats.total}</span>
      </div>

      <div className="max-w-6xl mx-auto px-5 pt-4 flex flex-wrap gap-2">
        <button
          onClick={handleDownloadAllImages}
          disabled={!!bulkDownloading}
          className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition disabled:opacity-50"
          style={{ background: "white", color: "#1E3A5F", border: "1px solid #E4DCC9" }}
        >
          <Download size={14} /> {bulkDownloading === "images" ? "그림 압축 중..." : "그림 전체 다운로드"}
        </button>
        <button
          onClick={handleDownloadAllSounds}
          disabled={!!bulkDownloading}
          className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition disabled:opacity-50"
          style={{ background: "white", color: "#1E3A5F", border: "1px solid #E4DCC9" }}
        >
          <Download size={14} /> {bulkDownloading === "sounds" ? "효과음 압축 중..." : "효과음 전체 다운로드"}
        </button>
        <button
          onClick={handleDownloadExcel}
          disabled={!!bulkDownloading}
          className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition disabled:opacity-50"
          style={{ background: "white", color: "#1E3A5F", border: "1px solid #E4DCC9" }}
        >
          <FileSpreadsheet size={14} /> {bulkDownloading === "excel" ? "엑셀 생성 중..." : "1200단어 엑셀 다운로드"}
        </button>
      </div>

      <div className="max-w-6xl mx-auto px-5 pt-5">
        <div className="relative">
          <Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "#9CA8B8" }} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="단어 검색..."
            className="w-full pl-10 pr-4 py-2.5 rounded-xl border text-sm outline-none focus:ring-2"
            style={{ borderColor: "#E4DCC9", background: "#FFFFFF" }}
          />
        </div>
      </div>

      {!query && (
        <div className="max-w-6xl mx-auto px-5 pt-4">
          <div className="flex gap-1.5 overflow-x-auto pb-1">
            {letters.map((L) => {
              const count = words.filter((w) => w.word[0].toUpperCase() === L).length;
              const active = activeLetter === L;
              return (
                <button
                  key={L}
                  onClick={() => setActiveLetter(L)}
                  disabled={count === 0}
                  className="flex-shrink-0 px-3.5 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition relative"
                  style={{
                    color: active ? "#1E3A5F" : count === 0 ? "#D8D2C4" : "#8A7F68",
                    borderColor: active ? "#D9A441" : "transparent",
                    background: active ? "#FFFFFF" : "transparent",
                  }}
                >
                  {L}
                  {count > 0 && (
                    <span className="ml-1 text-[10px] align-top" style={{ color: active ? "#D9A441" : "#B9AE94" }}>
                      {count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}

      <main className="max-w-6xl mx-auto px-5 py-5">
        {filteredWords.length === 0 ? (
          <div className="text-center py-20" style={{ color: "#9CA8B8" }}>
            {(loaded && baseWords) ? "이 조건에 맞는 단어가 없어요." : "불러오는 중..."}
          </div>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {filteredWords.map((w) => {
              const m = media[w.word] || {};
              const hasImg = !!m.image;
              const hasAud = !!m.definitionAudio;
              const isArmed = confirmDelete === w.word;
              return (
                <div key={w.word} className="relative">
                  <button
                    onClick={() => setSelectedWord(w)}
                    className="text-left rounded-xl border p-3 transition hover:-translate-y-0.5 hover:shadow-md bg-white w-full"
                    style={{ borderColor: "#EAE2CE" }}
                  >
                    <div className="w-full aspect-square rounded-lg mb-2 flex items-center justify-center overflow-hidden" style={{ background: "#F3EEE0" }}>
                      {hasImg ? (
                        <img src={m.image} alt={w.word} className="w-full h-full object-cover" style={{ objectPosition: "0% 50%", width: "400%" }} />
                      ) : (
                        <ImageIcon size={22} style={{ color: "#C9BF9F" }} />
                      )}
                    </div>
                    <div className="font-serif text-sm font-semibold truncate" style={{ color: "#1E3A5F" }}>{w.word}</div>
                    <div className="flex items-center gap-1.5 mt-1.5">
                      <StatusDot ok={hasImg} label="그림" />
                      <StatusDot ok={hasAud} label="소리" />
                    </div>
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); setConfirmDelete(w.word); }}
                    className="absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center shadow"
                    style={{ background: "rgba(255,255,255,0.9)" }}
                  >
                    <Trash2 size={12} style={{ color: "#C4593F" }} />
                  </button>
                  {isArmed && (
                    <div
                      className="absolute inset-0 rounded-xl flex flex-col items-center justify-center gap-2 z-10"
                      style={{ background: "rgba(30,20,15,0.85)" }}
                    >
                      <span className="text-white text-xs px-2 text-center">삭제할까요?</span>
                      <div className="flex gap-2">
                        <button
                          onClick={(e) => { e.stopPropagation(); handleDeleteWord(w.word); }}
                          className="px-2.5 py-1 rounded-md text-xs font-medium"
                          style={{ background: "#C4593F", color: "white" }}
                        >
                          삭제
                        </button>
                        <button
                          onClick={(e) => { e.stopPropagation(); setConfirmDelete(null); }}
                          className="px-2.5 py-1 rounded-md text-xs font-medium"
                          style={{ background: "#EAE2CE", color: "#1E3A5F" }}
                        >
                          취소
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </main>

      {status && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full text-sm text-white shadow-lg z-50" style={{ background: "#1E3A5F" }}>
          {status}
        </div>
      )}

      {selectedWord && (
        <div className="fixed inset-0 z-40 flex justify-end">
          <div className="absolute inset-0" style={{ background: "rgba(20,25,35,0.45)" }} onClick={() => setSelectedWord(null)} />
          <div className="relative w-full sm:max-w-md h-full bg-white overflow-y-auto shadow-2xl">
            <div className="sticky top-0 z-10 flex items-center justify-between px-5 py-4 border-b" style={{ background: "#FBF7EF", borderColor: "#EAE2CE" }}>
              <div>
                <div className="text-xs" style={{ color: "#9C8F70" }}>{pendingFields.gloss || selectedWord.gloss}</div>
                <h2 className="font-serif text-2xl font-bold" style={{ color: "#1E3A5F" }}>{selectedWord.word}</h2>
              </div>
              <button onClick={() => setSelectedWord(null)} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: "#F0EADA" }}>
                <X size={16} style={{ color: "#5B6B7F" }} />
              </button>
            </div>

            <div className="p-5 space-y-6 pb-28">
              <section>
                <SectionLabel text="한글 뜻 / 사전적 정의 / 예문 (수정 가능)" />
                <div className="space-y-2">
                  <FormField label="한글 뜻" value={pendingFields.gloss} onChange={(v) => handleFieldChange("gloss", v)} placeholder="예: 따다, 줍다" />
                  <FormField label="사전적 정의 (영어)" value={pendingFields.defn} onChange={(v) => handleFieldChange("defn", v)} placeholder="To pick means to..." multiline />
                  <FormField label="예문 (영어)" value={pendingFields.example} onChange={(v) => handleFieldChange("example", v)} placeholder="This girl is picking..." multiline />
                </div>
              </section>

              <section>
                <SectionLabel icon={<ImageIcon size={15} />} text="그림 스프라이트 (4프레임, 정사각형)" />
                <UploadBox accept="image/*" onFile={handleImageUpload} hasFile={!!selectedMedia.image} />
                {selectedMedia.image && (
                  <div className="mt-3">
                    <div
                      className="mx-auto rounded-xl overflow-hidden border"
                      style={{
                        width: 180,
                        height: 180,
                        borderColor: "#EAE2CE",
                        backgroundImage: "url(" + selectedMedia.image + ")",
                        backgroundSize: "400% 100%",
                        backgroundPosition: previewPlaying ? "100% 0" : "0% 0",
                        transition: previewPlaying ? "background-position " + duration + "s steps(3)" : "none",
                      }}
                    />
                    <button onClick={togglePreview} className="mx-auto mt-2 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium" style={{ background: "#1E3A5F", color: "white" }}>
                      {previewPlaying ? <Pause size={12} /> : <Play size={12} />}
                      {previewPlaying ? "재생중" : "미리보기 재생"}
                    </button>
                  </div>
                )}
              </section>

              <section>
                <SectionLabel text="총 애니메이션 재생 시간" />
                <div className="flex items-center gap-3">
                  <input
                    type="range"
                    min={0.5}
                    max={3}
                    step={0.1}
                    value={duration}
                    onChange={(e) => handleDurationChange(parseFloat(e.target.value))}
                    className="flex-1"
                  />
                  <span className="text-sm font-mono w-14 text-right px-2 py-1 rounded-md" style={{ background: "#F0EADA", color: "#1E3A5F" }}>
                    {duration.toFixed(1)}s
                  </span>
                </div>
                <p className="text-xs mt-1" style={{ color: "#9C8F70" }}>
                  권장: 빠른 동작 1.0~1.2s · 일반 1.4~1.8s · 천천히 변하는 것 1.8~2.0s
                </p>
              </section>

              <section>
                <SectionLabel icon={<Music size={15} />} text="단어 발음 오디오" />
                <UploadBox accept="audio/*" onFile={handleWordAudioUpload} hasFile={!!selectedMedia.wordAudio} />
                {selectedMedia.wordAudio && <audio controls src={selectedMedia.wordAudio} className="w-full mt-2" style={{ height: 36 }} />}
              </section>

              <section>
                <SectionLabel icon={<Music size={15} />} text="영영풀이 오디오 (정의+예문)" />
                <UploadBox accept="audio/*" onFile={handleDefinitionAudioUpload} hasFile={!!selectedMedia.definitionAudio} />
                {selectedMedia.definitionAudio && <audio controls src={selectedMedia.definitionAudio} className="w-full mt-2" style={{ height: 36 }} />}
              </section>

              <section>
                <SectionLabel icon={<Music size={15} />} text={"효과음 (최대 " + MAX_EFFECTS + "개, 순서대로 이어서 재생 · 그림 애니메이션 시간에 맞춰 자동으로 멈춰요)"} />
                <div className="space-y-2">
                  {(selectedMedia.soundEffects || []).map((src, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <span className="flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-semibold" style={{ background: "#F0EADA", color: "#8A7F68" }}>
                        {idx + 1}
                      </span>
                      <audio controls src={src} className="flex-1" style={{ height: 36 }} />
                      <button
                        onClick={() => handleRemoveSoundEffect(idx)}
                        className="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center"
                        style={{ background: "#FBEAE6" }}
                      >
                        <Trash2 size={12} style={{ color: "#C4593F" }} />
                      </button>
                    </div>
                  ))}
                </div>
                {(selectedMedia.soundEffects || []).length < MAX_EFFECTS && (
                  <div className="mt-2">
                    <UploadBox accept="audio/*" onFile={handleAddSoundEffect} hasFile={false} />
                  </div>
                )}
              </section>

              {saveResult === "error" && (
                <div className="text-xs px-3 py-2.5 rounded-lg" style={{ background: "#FBEAE6", color: "#B0402C" }}>
                  <p className="font-semibold mb-0.5">저장 실패</p>
                  <p>{saveErrorMsg}</p>
                </div>
              )}
              {saveResult === "success" && (
                <div className="flex items-center gap-2 text-xs px-3 py-2.5 rounded-lg" style={{ background: "#EFF6EE", color: "#4C7A5B" }}>
                  <Check size={14} /> 저장 완료됐어요.
                </div>
              )}
            </div>

            {/* 하단 고정 저장 버튼 */}
            <div className="sticky bottom-0 left-0 right-0 p-4 border-t" style={{ background: "white", borderColor: "#EAE2CE" }}>
              <button
                onClick={saveSelected}
                disabled={!isDirty || saving}
                className="w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition"
                style={{
                  background: !isDirty ? "#F0EADA" : saving ? "#B9AE94" : "#D9A441",
                  color: !isDirty ? "#B0A588" : "#1E3A5F",
                  cursor: !isDirty || saving ? "not-allowed" : "pointer",
                }}
              >
                {saving ? "저장 중..." : isDirty ? "저장하기" : "저장할 변경사항 없음"}
              </button>
            </div>
          </div>
        </div>
      )}

      {showAddForm && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-5">
          <div className="absolute inset-0" style={{ background: "rgba(20,25,35,0.5)" }} onClick={() => setShowAddForm(false)} />
          <div className="relative w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-serif text-lg font-bold" style={{ color: "#1E3A5F" }}>새 단어 추가</h3>
              <button onClick={() => setShowAddForm(false)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: "#F0EADA" }}>
                <X size={14} style={{ color: "#5B6B7F" }} />
              </button>
            </div>
            <div className="space-y-3">
              <FormField label="단어 (영어)" value={newWordForm.word} onChange={(v) => setNewWordForm((f) => ({ ...f, word: v }))} placeholder="예: pick" />
              <FormField label="뜻 (한글)" value={newWordForm.gloss} onChange={(v) => setNewWordForm((f) => ({ ...f, gloss: v }))} placeholder="예: 따다, 줍다" />
              <FormField label="정의 (영어)" value={newWordForm.defn} onChange={(v) => setNewWordForm((f) => ({ ...f, defn: v }))} placeholder="To pick means to..." multiline />
              <FormField label="예문 (영어)" value={newWordForm.example} onChange={(v) => setNewWordForm((f) => ({ ...f, example: v }))} placeholder="This girl is picking..." multiline />
            </div>
            <button
              onClick={handleAddWord}
              className="w-full mt-4 py-2.5 rounded-xl font-medium text-sm"
              style={{ background: "#D9A441", color: "#1E3A5F" }}
            >
              추가하기
            </button>
          </div>
        </div>
      )}
      </>
      )}
    </div>
  );
}

// 학년 배열 (기존 사이트와 동일 순서)
const GRADES = ['4세','5세','6세','7세','초1','초2','초3','초4','초5','초6','중1','중2','중3','고등이상'];

function calcCurrentGrade(joinGrade, joinDateStr) {
  if (!joinGrade || joinGrade === '고등이상') return joinGrade || '-';
  if (!joinDateStr) return joinGrade;
  const joinDate = new Date(joinDateStr);
  const now = new Date();
  const yearsPassed = now.getFullYear() - joinDate.getFullYear();
  const gradeIdx = GRADES.indexOf(joinGrade);
  if (gradeIdx === -1) return joinGrade;
  const newIdx = Math.min(gradeIdx + yearsPassed, GRADES.length - 1);
  return GRADES[newIdx];
}

function StudentLinksPanel() {
  const [allStudents, setAllStudents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [copiedId, setCopiedId] = useState(null);
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState({});

  useEffect(() => {
    (async () => {
      try {
        const snap = await db.collection("students").get();
        const list = [];
        snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
        setAllStudents(list.filter((s) => !s.withdrawn));
      } catch (e) {
        console.error("학생 목록 불러오기 실패:", e);
      }
      setLoading(false);
    })();
  }, []);

  // 대표자녀(main 또는 studentType 미설정) + 형제자매 그룹핑 (기존 사이트와 동일 로직)
  const mainStudents = useMemo(() => {
    const mains = allStudents
      .filter((s) => s.studentType === "main" || !s.studentType)
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko"));
    return mains;
  }, [allStudents]);

  const siblingMap = useMemo(() => {
    const map = {};
    allStudents
      .filter((s) => s.studentType === "sibling")
      .forEach((s) => {
        if (!map[s.mainStudentId]) map[s.mainStudentId] = [];
        map[s.mainStudentId].push(s);
      });
    return map;
  }, [allStudents]);

  const studentAppUrl = (id) => {
    const base = location.origin + location.pathname.replace(/admin\.html$/, "");
    return base + "student-app.html?student=" + id;
  };

  const copyLink = (id) => {
    const url = studentAppUrl(id);
    navigator.clipboard?.writeText(url).then(
      () => { setCopiedId(id); setTimeout(() => setCopiedId(null), 1500); },
      () => { prompt("아래 링크를 복사하세요:", url); }
    );
  };

  const toggleExpand = (id) => {
    setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
  };

  const q = search.trim().toLowerCase();
  const visibleMains = q
    ? mainStudents.filter((s) => (s.name || "").toLowerCase().includes(q))
    : mainStudents;

  return (
    <div className="max-w-3xl mx-auto px-5 py-5">
      <div className="relative mb-4">
        <Search size={17} className="absolute top-1/2 -translate-y-1/2" style={{ left: 12, color: "#9CA8B8" }} />
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="학생 이름 검색..."
          className="w-full pl-10 pr-4 py-2.5 rounded-xl border text-sm outline-none"
          style={{ borderColor: "#E4DCC9", background: "#FFFFFF" }}
        />
      </div>

      {loading ? (
        <p className="text-sm text-center py-10" style={{ color: "#9CA8B8" }}>불러오는 중...</p>
      ) : visibleMains.length === 0 ? (
        <p className="text-sm text-center py-10" style={{ color: "#9CA8B8" }}>
          등록된 학생이 없어요. (기존 사이트에서 먼저 학생을 등록해주세요)
        </p>
      ) : (
        <div className="space-y-2">
          {visibleMains.map((s) => {
            const siblings = siblingMap[s.id] || [];
            const isOpen = !!expanded[s.id];
            const grade = calcCurrentGrade(s.grade, s.joinDate);
            return (
              <div key={s.id} className="rounded-xl bg-white border overflow-hidden" style={{ borderColor: "#EAE2CE" }}>
                <div className="flex items-center justify-between gap-3 p-3.5">
                  <div className="flex items-center gap-2 min-w-0">
                    {siblings.length > 0 && (
                      <button
                        onClick={() => toggleExpand(s.id)}
                        className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center"
                        style={{ background: "#F0EADA" }}
                      >
                        {isOpen ? <ChevronDown size={13} style={{ color: "#5B6B7F" }} /> : <Plus size={13} style={{ color: "#5B6B7F" }} />}
                      </button>
                    )}
                    <div className="min-w-0">
                      <p className="font-serif text-base font-semibold truncate" style={{ color: "#1E3A5F" }}>
                        {s.name || "(이름 없음)"}
                      </p>
                      <p className="text-xs truncate" style={{ color: "#9C8F70" }}>
                        {grade !== "-" ? grade + " · " : ""}{s.school || ""}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => copyLink(s.id)}
                    className="flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium transition"
                    style={{
                      background: copiedId === s.id ? "#E7F3E9" : "#1E3A5F",
                      color: copiedId === s.id ? "#2E6B3E" : "white",
                    }}
                  >
                    {copiedId === s.id ? (<><Check size={13} /> 복사됨</>) : "링크 복사"}
                  </button>
                </div>

                {isOpen && siblings.length > 0 && (
                  <div style={{ borderTop: "1px solid #EAE2CE", background: "#FBF7EF" }}>
                    {siblings.map((sib) => {
                      const sibGrade = calcCurrentGrade(sib.grade, sib.joinDate);
                      return (
                        <div key={sib.id} className="flex items-center justify-between gap-3 pl-11 pr-3.5 py-3" style={{ borderTop: "1px solid #EFE8D6" }}>
                          <div className="min-w-0">
                            <p className="font-serif text-sm font-semibold truncate" style={{ color: "#1E3A5F" }}>
                              {sib.name || "(이름 없음)"}
                              <span className="ml-1.5 text-[10px] font-normal px-1.5 py-0.5 rounded-full" style={{ background: "#F0EADA", color: "#9C8F70" }}>형제자매</span>
                            </p>
                            <p className="text-xs truncate" style={{ color: "#9C8F70" }}>
                              {sibGrade !== "-" ? sibGrade + " · " : ""}{sib.school || ""}
                            </p>
                          </div>
                          <button
                            onClick={() => copyLink(sib.id)}
                            className="flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium transition"
                            style={{
                              background: copiedId === sib.id ? "#E7F3E9" : "#1E3A5F",
                              color: copiedId === sib.id ? "#2E6B3E" : "white",
                            }}
                          >
                            {copiedId === sib.id ? (<><Check size={13} /> 복사됨</>) : "링크 복사"}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function UploadBox({ accept, onFile, hasFile }) {
  const [dragOver, setDragOver] = useState(false);
  const inputId = useRef("upl-" + Math.random().toString(36).slice(2)).current;
  return (
    <label
      htmlFor={inputId}
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={(e) => {
        e.preventDefault();
        setDragOver(false);
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) onFile(f);
      }}
      className="border-2 border-dashed rounded-xl py-4 flex flex-col items-center justify-center gap-1 cursor-pointer transition block"
      style={{
        position: "relative",
        borderColor: dragOver ? "#D9A441" : hasFile ? "#B7D6BE" : "#E4DCC9",
        background: dragOver ? "#FBF3E0" : hasFile ? "#F3F9F4" : "#FBF9F3",
      }}
    >
      <Upload size={18} style={{ color: hasFile ? "#4C9A5F" : "#B0A588" }} />
      <span className="text-xs" style={{ color: "#8A7F68" }}>
        {hasFile ? "다시 올리려면 클릭 또는 드래그" : "클릭하거나 파일을 끌어다 놓으세요"}
      </span>
      <input
        id={inputId}
        type="file"
        accept={accept}
        style={{
          position: "absolute",
          top: 0, left: 0, right: 0, bottom: 0,
          width: "100%", height: "100%",
          opacity: 0,
          cursor: "pointer",
        }}
        onChange={(e) => {
          const f = e.target.files && e.target.files[0];
          if (f) onFile(f);
          e.target.value = "";
        }}
      />
    </label>
  );
}


function PasswordGate({ children }) {
  const ADMIN_PASSWORD = "bookquiz2024";
  const [unlocked, setUnlocked] = useState(false);
  const [input, setInput] = useState("");
  const [error, setError] = useState(false);
  const [checked, setChecked] = useState(false);

  useEffect(() => {
    try {
      if (sessionStorage.getItem("admin-unlocked") === "1") {
        setUnlocked(true);
      }
    } catch (e) {}
    setChecked(true);
  }, []);

  const submit = (e) => {
    e.preventDefault();
    if (input === ADMIN_PASSWORD) {
      setUnlocked(true);
      setError(false);
      try { sessionStorage.setItem("admin-unlocked", "1"); } catch (e) {}
    } else {
      setError(true);
    }
  };

  if (!checked) return null;
  if (unlocked) return children;

  return (
    <div className="w-full h-screen flex items-center justify-center" style={{ background: "#0F1B2D" }}>
      <form onSubmit={submit} className="w-full max-w-xs px-6 py-8 rounded-2xl" style={{ background: "#FBF7EF" }}>
        <div className="text-center mb-5">
          <div className="w-11 h-11 mx-auto rounded-xl flex items-center justify-center text-lg font-bold mb-3" style={{ background: "#D9A441", color: "#1E3A5F" }}>
            📖
          </div>
          <h1 className="font-serif text-lg font-bold" style={{ color: "#1E3A5F" }}>관리자 페이지</h1>
          <p className="text-xs mt-1" style={{ color: "#9C8F70" }}>비밀번호를 입력해주세요</p>
        </div>
        <input
          type="password"
          value={input}
          onChange={(e) => { setInput(e.target.value); setError(false); }}
          autoFocus
          className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none mb-2"
          style={{ borderColor: error ? "#E2A093" : "#E4DCC9", background: "white" }}
          placeholder="비밀번호"
        />
        {error && <p className="text-xs mb-2" style={{ color: "#C4593F" }}>비밀번호가 틀렸어요</p>}
        <button
          type="submit"
          className="w-full py-2.5 rounded-lg text-sm font-medium mt-1"
          style={{ background: "#1E3A5F", color: "white" }}
        >
          입장하기
        </button>
      </form>
    </div>
  );
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// zip 안의 파일명에서 코드(단어 앞글자)와 종류를 추출합니다.
// 규칙: <코드><숫자*>M<숫자*><W|D>.mp3
//   예) GOAT0M0W.mp3 = 단어발음, GOAT0M0D.mp3 = 정의음성 (영영풀이)
const BULK_FILE_RE = /^([A-Z]{2,4})\d*M\d*([WD])\.mp3$/i;

function BulkZipUploadPanel({ allWords }) {
  const [file, setFile] = useState(null);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [log, setLog] = useState([]);
  const [skipped, setSkipped] = useState([]);
  const [conflicts, setConflicts] = useState([]);

  const handleRun = async () => {
    if (!file || running) return;
    setRunning(true);
    setLog([]);
    setSkipped([]);
    setConflicts([]);
    try {
      const zip = await JSZip.loadAsync(file);

      // 1) "코드 -> 단어" 매핑 생성 (코드 = 단어 앞 4글자 대문자, 4글자보다 짧은 단어는 전체)
      const codeToWord = {};
      const conflictList = [];
      for (const w of allWords) {
        const code = w.word.slice(0, 4).toUpperCase();
        if (codeToWord[code] && codeToWord[code] !== w.word) {
          conflictList.push(code + " → " + codeToWord[code] + " / " + w.word + " 코드 중복 (뒤에 나온 " + w.word + "는 건너뜀)");
          continue;
        }
        codeToWord[code] = w.word;
      }
      setConflicts(conflictList);

      // 2) zip 안 파일들을 코드별로 묶기
      const groups = {};
      const unmatched = [];
      const entries = Object.keys(zip.files)
        .map((k) => zip.files[k])
        .filter((f) => !f.dir);

      for (const entry of entries) {
        const base = entry.name.split("/").pop();
        const m = base.match(BULK_FILE_RE);
        if (!m) { unmatched.push(entry.name + " (형식 인식 불가 - W/D 음성 mp3만 지원)"); continue; }
        const code = m[1].toUpperCase();
        const kind = m[2].toUpperCase();
        if (!groups[code]) groups[code] = {};
        if (kind === "W") {
          groups[code].wordAudioEntry = entry;
        } else if (kind === "D") {
          groups[code].definitionAudioEntry = entry;
        } else {
          unmatched.push(entry.name + " (음성 종류 불명)");
        }
      }

      const codes = Object.keys(groups);
      setProgress({ done: 0, total: codes.length });

      const matchedLog = [];
      const skipReasons = [];

      for (let i = 0; i < codes.length; i++) {
        const code = codes[i];
        const word = codeToWord[code];
        if (!word) {
          skipReasons.push("코드 " + code + ": 단어 목록에서 일치하는 단어를 찾지 못함");
          setProgress({ done: i + 1, total: codes.length });
          continue;
        }
        const g = groups[code];
        const updates = {};
        const appliedFields = [];
        try {
          if (g.wordAudioEntry) {
            updates.wordAudio = await blobToDataUrl(await g.wordAudioEntry.async("blob"));
            appliedFields.push("단어발음");
          }
          if (g.definitionAudioEntry) {
            updates.definitionAudio = await blobToDataUrl(await g.definitionAudioEntry.async("blob"));
            appliedFields.push("정의음성");
          }
          if (appliedFields.length > 0) {
            let existing = {};
            try {
              const r = await window.storage.get("media:" + word, true);
              if (r && r.value) existing = JSON.parse(r.value);
            } catch (e) {}
            const merged = { ...existing, ...updates };
            await window.storage.set("media:" + word, JSON.stringify(merged), true);
            matchedLog.push(word + " (" + code + "): " + appliedFields.join(", "));
          }
        } catch (err) {
          skipReasons.push(word + " (" + code + "): 저장 실패 - " + err.message);
        }
        setProgress({ done: i + 1, total: codes.length });
      }

      setLog(matchedLog);
      setSkipped([...skipReasons, ...unmatched]);
    } catch (e) {
      alert("업로드 중 오류가 발생했어요: " + e.message);
    } finally {
      setRunning(false);
    }
  };

  return (
    <div className="max-w-3xl mx-auto px-5 py-6">
      <div className="bg-white rounded-xl p-5 border" style={{ borderColor: "#E7E1D3" }}>
        <h2 className="text-base font-bold mb-2" style={{ color: "#1E3A5F" }}>단어소리/영영풀이소리 zip 일괄 업로드</h2>
        <p className="text-sm mb-4" style={{ color: "#5B6B7F" }}>
          zip 안의 파일명 앞 4글자를 단어의 앞 4글자와 자동으로 매칭합니다. 접미사 규칙: <b>0W</b>=단어 발음,{" "}
          <b>0D</b>=영영풀이 음성 (mp3만 지원). 그림·효과음은 이 일괄 업로드에 포함되지 않으니 각 단어에서 직접 올려주세요.
          이미 등록된 다른 정보는 그대로 유지되고, zip에 있는 항목만 덮어씁니다.
        </p>
        <input
          type="file"
          accept=".zip"
          onChange={(e) => setFile(e.target.files[0] || null)}
          className="text-sm mb-3 block"
        />
        <button
          onClick={handleRun}
          disabled={!file || running}
          className="px-4 py-2 rounded-lg text-sm font-semibold"
          style={{ background: file && !running ? "#D9A441" : "#E7E1D3", color: "#1E3A5F" }}
        >
          {running ? "업로드 중... (" + progress.done + "/" + progress.total + ")" : "일괄 업로드 시작"}
        </button>

        {conflicts.length > 0 && (
          <div className="mt-4 text-xs" style={{ color: "#B45309" }}>
            <b>단어 코드 중복 경고 ({conflicts.length}건)</b>
            <ul className="list-disc pl-5 mt-1 max-h-48 overflow-auto">
              {conflicts.slice(0, 30).map((c, i) => <li key={i}>{c}</li>)}
            </ul>
          </div>
        )}

        {log.length > 0 && (
          <div className="mt-4 text-xs" style={{ color: "#1E3A5F" }}>
            <b>업로드 완료 ({log.length}개 단어)</b>
            <ul className="list-disc pl-5 mt-1 max-h-60 overflow-auto">
              {log.map((l, i) => <li key={i}>{l}</li>)}
            </ul>
          </div>
        )}

        {skipped.length > 0 && (
          <div className="mt-4 text-xs" style={{ color: "#8A7F68" }}>
            <b>건너뜀 ({skipped.length}건)</b>
            <ul className="list-disc pl-5 mt-1 max-h-60 overflow-auto">
              {skipped.slice(0, 100).map((s, i) => <li key={i}>{s}</li>)}
            </ul>
          </div>
        )}
      </div>
    </div>
  );
}
