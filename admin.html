<script>
// ============================================================
// firebase-storage.js
// 1200 Word Dictionary - Firebase 연동 공용 스크립트 (Firestore만 사용, 무료)
//
// Storage(유료 Blaze 필요) 대신, 그림/오디오도 전부 Firestore에 직접 저장합니다.
// Firestore 문서는 1개당 1MB 제한이 있어서, 큰 필드(그림/오디오)는 자동으로
// 별도 문서에 나눠 저장하고 불러올 때 다시 합칩니다. 그래도 필드 하나가
// 900KB를 넘으면 저장이 안 되니, 그럴 땐 파일을 더 압축해서 올려주세요.
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCPa5LJHQV-nm4F3djEL1481htlJlrE0hU",
  authDomain: "book-quiz-5cfec.firebaseapp.com",
  projectId: "book-quiz-5cfec",
  storageBucket: "book-quiz-5cfec.firebasestorage.app",
  messagingSenderId: "352729909403",
  appId: "1:352729909403:web:8cbc1b592995bc2fe91e3e",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_FIELD_BYTES = 900 * 1024; // Firestore 문서 1MB 제한 대비 여유

function sanitizeKey(key) {
  return String(key).replace(/[\/\s]/g, "_");
}

function byteLength(str) {
  return new TextEncoder().encode(str).length;
}

window.storage = {
  // value: JSON 문자열. 큰 필드(base64 그림/오디오 등)는 자동으로
  // 별도 Firestore 문서(key__필드명)로 분리 저장합니다.
  async set(key, value, shared) {
    const k = sanitizeKey(key);
    let parsed;
    try {
      parsed = JSON.parse(value);
    } catch (e) {
      parsed = value;
    }

    const external = [];
    const inline = {};

    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        if (typeof v === "string" && byteLength(v) > MAX_FIELD_BYTES) {
          throw new Error(
            "'" + field + "' 파일이 너무 커요 (약 " + Math.round(byteLength(v) / 1024) +
            "KB). 900KB 이하로 압축해서 다시 올려주세요."
          );
        }
      }
      // 문서 전체가 커지지 않도록, 필드 하나당 200KB 넘으면 별도 문서로 분리
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        if (typeof v === "string" && byteLength(v) > 200 * 1024) {
          external.push(field);
        } else {
          inline[field] = v;
        }
      }
    } else {
      inline.__raw = parsed;
    }

    // 별도 문서로 분리된 필드 저장
    for (const field of external) {
      await db.collection("kv").doc(k + "__" + field).set({
        value: parsed[field],
        updatedAt: Date.now(),
      });
    }

    // 매니페스트(본문) 문서 저장
    await db.collection("kv").doc(k).set({
      isManifest: true,
      value: JSON.stringify(inline),
      external: external,
      shared: !!shared,
      updatedAt: Date.now(),
    });

    // 호출한 쪽에서 바로 쓸 수 있도록 완전한 값을 재조합해서 반환
    const fullValue = parsed && typeof parsed === "object" && !Array.isArray(parsed)
      ? JSON.stringify(parsed)
      : value;
    return { key, value: fullValue, shared: !!shared };
  },

  async get(key, shared) {
    const k = sanitizeKey(key);
    const doc = await db.collection("kv").doc(k).get();
    if (!doc.exists) {
      throw new Error("not found: " + key);
    }
    const data = doc.data();
    let obj;
    try {
      obj = JSON.parse(data.value);
    } catch (e) {
      obj = data.value;
    }
    if (data.external && data.external.length && obj && typeof obj === "object") {
      for (const field of data.external) {
        try {
          const sub = await db.collection("kv").doc(k + "__" + field).get();
          if (sub.exists) obj[field] = sub.data().value;
        } catch (e) {}
      }
    }
    const finalValue = obj && typeof obj === "object" && obj.__raw !== undefined ? obj.__raw : JSON.stringify(obj);
    return { key, value: finalValue, shared: !!shared };
  },

  async delete(key, shared) {
    const k = sanitizeKey(key);
    try {
      const doc = await db.collection("kv").doc(k).get();
      if (doc.exists) {
        const data = doc.data();
        if (data.external && data.external.length) {
          for (const field of data.external) {
            await db.collection("kv").doc(k + "__" + field).delete().catch(() => {});
          }
        }
      }
    } catch (e) {}
    await db.collection("kv").doc(k).delete();
    return { key, deleted: true, shared: !!shared };
  },

  // prefix로 시작하는 "본문" 문서 ID들만 찾습니다 (분리 저장된 __필드 문서는 제외)
  async list(prefix, shared) {
    const p = sanitizeKey(prefix || "");
    let query = db.collection("kv");
    if (p) {
      query = query
        .where(firebase.firestore.FieldPath.documentId(), ">=", p)
        .where(firebase.firestore.FieldPath.documentId(), "<", p + "\uf8ff");
    }
    const snap = await query.get();
    const keys = [];
    snap.forEach((doc) => {
      if (doc.data().isManifest) keys.push(doc.id);
    });
    return { keys, prefix, shared: !!shared };
  },
};

  const readFileAsDataUrl = (file) =>
    new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("read failed"));
      reader.readAsDataURL(file);

  // ---- 전체 다운로드 (그림 / 효과음 / 엑셀) ----
  const [bulkDownloading, setBulkDownloading] = useState(""); // "" | "images" | "sounds" | "excel"

  const dataUrlExt = (dataUrl, fallback) => {
    const m = /^data:[^;]+\/([a-zA-Z0-9.+-]+);base64,/.exec(dataUrl || "");
    if (!m) return fallback;
    let ext = m[1].toLowerCase();
    if (ext === "jpeg") ext = "jpg";
    if (ext === "mpeg") ext = "mp3";
    return ext;
  };

  const sanitizeFileName = (s) => String(s).replace(/[\\/:*?"<>|]/g, "_");

  const dataUrlToArrayBuffer = (dataUrl) => {
    const base64 = dataUrl.split(",")[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  };

  // 효과음 여러 개를 하나의 모노 PCM(Float32)으로 순서대로 이어붙입니다.
  const concatToMonoFloat32 = async (dataUrls, audioCtx) => {
    const buffers = [];
    let totalLength = 0;
    for (const url of dataUrls) {
      const arrBuf = dataUrlToArrayBuffer(url);
      const audioBuffer = await audioCtx.decodeAudioData(arrBuf);
      buffers.push(audioBuffer);
      totalLength += audioBuffer.length;
    }
    const result = new Float32Array(totalLength);
    let offset = 0;
    for (const buf of buffers) {
      let channelData;
      if (buf.numberOfChannels > 1) {
        channelData = new Float32Array(buf.length);
        for (let ch = 0; ch < buf.numberOfChannels; ch++) {
          const data = buf.getChannelData(ch);
          for (let i = 0; i < buf.length; i++) channelData[i] += data[i] / buf.numberOfChannels;
        }
      } else {
        channelData = buf.getChannelData(0);
      }
      result.set(channelData, offset);
      offset += channelData.length;
    }
    return result;
  };

  const floatTo16BitPCM = (samples) => {
    const out = new Int16Array(samples.length);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  };

  const encodeMp3 = (int16Samples, sampleRate) => {
    const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
    const blockSize = 1152;
    const mp3Data = [];
    for (let i = 0; i < int16Samples.length; i += blockSize) {
      const chunk = int16Samples.subarray(i, i + blockSize);
      const buf = mp3encoder.encodeBuffer(chunk);
      if (buf.length > 0) mp3Data.push(buf);
    }
    const end = mp3encoder.flush();
    if (end.length > 0) mp3Data.push(end);
    return new Blob(mp3Data, { type: "audio/mp3" });
  };

  // 효과음(최대 4개)을 재생 순서 그대로 이어붙여 하나의 mp3 파일로 만듭니다.
  const combineEffectsToMp3 = async (dataUrls) => {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContextClass();
    try {
      const floatSamples = await concatToMonoFloat32(dataUrls, audioCtx);
      const int16 = floatTo16BitPCM(floatSamples);
      return encodeMp3(int16, audioCtx.sampleRate);
    } finally {
      audioCtx.close();
    }
  };

  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };

  const handleDownloadAllImages = async () => {
    if (bulkDownloading) return;
    setBulkDownloading("images");
    try {
      const zip = new JSZip();
      let count = 0;
      for (const w of words) {
        const m = media[w.word];
        if (m && m.image) {
          const ext = dataUrlExt(m.image, "png");
          zip.file(sanitizeFileName(w.word) + "." + ext, m.image.split(",")[1], { base64: true });
          count++;
        }
      }
      if (count === 0) { flash("업로드된 그림이 없어요", true); setBulkDownloading(""); return; }
      const blob = await zip.generateAsync({ type: "blob" });
      downloadBlob(blob, "word-images.zip");
      flash(count + "개 그림 다운로드 완료");
    } catch (e) {
      console.error(e);
      flash("그림 다운로드 중 오류가 발생했어요", true);
    }
    setBulkDownloading("");
  };

  const handleDownloadAllSounds = async () => {
    if (bulkDownloading) return;
    setBulkDownloading("sounds");
    try {
      const zip = new JSZip();
      let count = 0;
      for (const w of words) {
        const m = media[w.word];
        if (!m) continue;
        if (m.wordAudio) {
          zip.file(sanitizeFileName(w.word) + "_word." + dataUrlExt(m.wordAudio, "mp3"), m.wordAudio.split(",")[1], { base64: true });
          count++;
        }
        if (m.definitionAudio) {
          zip.file(sanitizeFileName(w.word) + "_definition." + dataUrlExt(m.definitionAudio, "mp3"), m.definitionAudio.split(",")[1], { base64: true });
          count++;
        }
        const effects = (m.soundEffects || []).filter(Boolean);
        if (effects.length > 0) {
          // 애니메이션 재생 시 순서대로 이어지는 효과음이므로, 하나의 mp3로 합쳐서 담아요.
          const mp3Blob = await combineEffectsToMp3(effects);
          zip.file(sanitizeFileName(w.word) + "_effects.mp3", mp3Blob);
          count++;
        }
      }
      if (count === 0) { flash("업로드된 효과음/오디오가 없어요", true); setBulkDownloading(""); return; }
      const blob = await zip.generateAsync({ type: "blob" });
      downloadBlob(blob, "word-sounds.zip");
      flash(count + "개 오디오 다운로드 완료");
    } catch (e) {
      console.error(e);
      flash("효과음 다운로드 중 오류가 발생했어요", true);
    }
    setBulkDownloading("");
  };

  const handleDownloadExcel = () => {
    if (bulkDownloading) return;
    setBulkDownloading("excel");
    try {
      const rows = words.map((w) => ({
        단어: w.word,
        한글뜻: w.gloss,
        사전적정의: w.defn,
        예문: w.example,
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [{ wch: 18 }, { wch: 20 }, { wch: 55 }, { wch: 55 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "1200단어");
      XLSX.writeFile(wb, "1200-words.xlsx");
      flash(words.length + "개 단어 엑셀 다운로드 완료");
    } catch (e) {
      console.error(e);
      flash("엑셀 다운로드 중 오류가 발생했어요", true);
    }
    setBulkDownloading("");
  };

  // ---- 선택된 단어의 "임시 편집 상태" (아직 저장 안 된 변경사항) ----
  const [pendingMedia, setPendingMedia] = useState({ duration: DEFAULT_DURATION });
  const [pendingFields, setPendingFields] = useState({ gloss: "", defn: "", example: "" });
  const [saving, setSaving] = useState(false);
  const [saveResult, setSaveResult] = useState(null); // null | "success" | "error"
  const [saveErrorMsg, setSaveErrorMsg] = useState("");

  useEffect(() => {
    if (selectedWord) {
      setPendingMedia(media[selectedWord.word] || { duration: DEFAULT_DURATION });
      setPendingFields({
        gloss: selectedWord.gloss || "",
        defn: selectedWord.defn || "",
        example: selectedWord.example || "",
      });
      setSaveResult(null);
      setSaveErrorMsg("");
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedWord]);

  const isDirty = selectedWord
    ? JSON.stringify(pendingMedia) !== JSON.stringify(media[selectedWord.word] || { duration: DEFAULT_DURATION }) ||
      pendingFields.gloss !== (selectedWord.gloss || "") ||
      pendingFields.defn !== (selectedWord.defn || "") ||
      pendingFields.example !== (selectedWord.example || "")
    : false;

  const handleFieldChange = (field, value) => {
    setPendingFields((prev) => ({ ...prev, [field]: value }));
    setSaveResult(null);
  };

  // ---- 효과음 (최대 4개, 순서대로 재생) ----
  const MAX_EFFECTS = 4;
  const handleAddSoundEffect = async (file) => {
    if (!file) return;
    const current = pendingMedia.soundEffects || [];
    if (current.length >= MAX_EFFECTS) { flash(`효과음은 최대 ${MAX_EFFECTS}개까지 올릴 수 있어요`, true); return; }
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, soundEffects: [...(prev.soundEffects || []), dataUrl] }));
      setSaveResult(null);
    } catch (e) {
      flash("효과음을 읽지 못했어요", true);
    }
  };
  const handleRemoveSoundEffect = (idx) => {
    setPendingMedia((prev) => ({
      ...prev,
      soundEffects: (prev.soundEffects || []).filter((_, i) => i !== idx),
    }));
    setSaveResult(null);
  };

  const handleImageUpload = async (file) => {
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, image: dataUrl }));
      setSaveResult(null);
    } catch (e) {
      flash("그림을 읽지 못했어요", true);
    }
  };

  const handleWordAudioUpload = async (file) => {
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, wordAudio: dataUrl }));
      setSaveResult(null);
    } catch (e) {
      flash("오디오를 읽지 못했어요", true);
    }
  };

  const handleDefinitionAudioUpload = async (file) => {
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      setPendingMedia((prev) => ({ ...prev, definitionAudio: dataUrl }));
      setSaveResult(null);
    } catch (e) {
      flash("오디오를 읽지 못했어요", true);
    }
  };

  const handleDurationChange = (value) => {
    setPendingMedia((prev) => ({ ...prev, duration: value }));
  };

  const saveSelected = async () => {
    if (!selectedWord) return;
    setSaving(true);
    setSaveResult(null);
    try {
      const res = await window.storage.set("media:" + selectedWord.word, JSON.stringify(pendingMedia), true);
      if (res && res.value) {
        const savedValue = JSON.parse(res.value); // Storage 업로드 후 실제 URL로 치환된 값
        setMedia((prev) => ({ ...prev, [selectedWord.word]: savedValue }));
        setPendingMedia(savedValue);
      } else {
        setSaveResult("error");
        setSaveErrorMsg("저장에 실패했어요. Firebase Storage 규칙(rules)이 쓰기를 막고 있을 수 있어요.");
        setSaving(false);
        return;
      }

      // 뜻/정의/예문이 바뀌었다면 word-edits에 함께 저장
      const fieldsChanged =
        pendingFields.gloss !== (selectedWord.gloss || "") ||
        pendingFields.defn !== (selectedWord.defn || "") ||
        pendingFields.example !== (selectedWord.example || "");
      if (fieldsChanged) {
        const nextEdits = {
          ...wordEdits,
          [selectedWord.word]: {
            gloss: pendingFields.gloss.trim() || "-",
            defn: pendingFields.defn.trim() || "(정의를 입력해주세요)",
            example: pendingFields.example.trim() || "(예문을 입력해주세요)",
          },
        };
        await window.storage.set("word-edits", JSON.stringify(nextEdits), true);
        setWordEdits(nextEdits);
        setSelectedWord((prev) => (prev ? { ...prev, ...nextEdits[selectedWord.word] } : prev));
      }

      setSaveResult("success");
    } catch (e) {
      console.error(e);
      setSaveResult("error");
      setSaveErrorMsg("저장 중 오류: " + (e && e.message ? e.message : String(e)));
    }
    setSaving(false);
  };

  useEffect(() => {
    if (!selectedWord) return;
    setPreviewPlaying(false);
  }, [selectedWord]);

  const togglePreview = () => setPreviewPlaying((p) => !p);

  const selectedMedia = pendingMedia;
  const duration = selectedMedia.duration || DEFAULT_DURATION;

  return (
    <div className="min-h-screen" style={{ background: "#FBF7EF", fontFamily: "ui-sans-serif, system-ui" }}>
      <header className="sticky top-0 z-20 border-b" style={{ background: "#1E3A5F", borderColor: "#14283F" }}>
        <div className="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center text-lg font-bold" style={{ background: "#D9A441", color: "#1E3A5F" }}>
              📖
            </div>
            <div>
              <h1 className="text-white font-serif text-xl tracking-tight leading-none">1200 Word Dictionary</h1>
              <p className="text-xs" style={{ color: "#B7C6DA" }}>관리자 업로드 도구</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden sm:flex items-center gap-4 text-sm">
              <span style={{ color: "#B7C6DA" }}>그림 <b className="text-white">{stats.img}</b>/{stats.total}</span>
              <span style={{ color: "#B7C6DA" }}>풀이음성 <b className="text-white">{stats.aud}</b>/{stats.total}</span>
            </div>
            <button
              onClick={() => setShowAddForm(true)}
              className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition"
              style={{ background: "#D9A441", color: "#1E3A5F" }}
            >
              <Plus size={16} /> 단어 추가
            </button>
          </div>
        </div>
      </header>

      <div className="max-w-6xl mx-auto px-5 pt-4 flex gap-2">
        <button
          onClick={() => setMainTab("words")}
          className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
          style={{ color: mainTab === "words" ? "#1E3A5F" : "#8A7F68", borderColor: mainTab === "words" ? "#D9A441" : "transparent", background: mainTab === "words" ? "white" : "transparent" }}
        >
          단어 관리
        </button>
        <button
          onClick={() => setMainTab("students")}
          className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
          style={{ color: mainTab === "students" ? "#1E3A5F" : "#8A7F68", borderColor: mainTab === "students" ? "#D9A441" : "transparent", background: mainTab === "students" ? "white" : "transparent" }}
        >
          학생 링크
        </button>
        <button
          onClick={() => setMainTab("bulk")}
          className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
          style={{ color: mainTab === "bulk" ? "#1E3A5F" : "#8A7F68", borderColor: mainTab === "bulk" ? "#D9A441" : "transparent", background: mainTab === "bulk" ? "white" : "transparent" }}
        >
          음성/이미지 일괄 업로드
        </button>
      </div>

      {mainTab === "students" && <StudentLinksPanel />}
      {mainTab === "bulk" && <BulkZipUploadPanel allWords={words} />}

      {mainTab === "words" && (
      <>
      <div className="sm:hidden px-5 py-2 text-xs flex gap-4" style={{ color: "#5B6B7F" }}>
        <span>그림 {stats.img}/{stats.total}</span>
        <span>풀이음성 {stats.aud}/{stats.total}</span>
      </div>

      <div className="max-w-6xl mx-auto px-5 pt-4 flex flex-wrap gap-2">
        <button
          onClick={handleDownloadAllImages}
          disabled={!!bulkDownloading}
          className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition disabled:opacity-50"
          style={{ background: "white", color: "#1E3A5F", border: "1px solid #E4DCC9" }}
        >
          <Download size={14} /> {bulkDownloading === "images" ? "그림 압축 중..." : "그림 전체 다운로드"}
        </button>
        <button
          onClick={handleDownloadAllSounds}
          disabled={!!bulkDownloading}
          className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition disabled:opacity-50"
          style={{ background: "white", color: "#1E3A5F", border: "1px solid #E4DCC9" }}
        >
          <Download size={14} /> {bulkDownloading === "sounds" ? "효과음 압축 중..." : "효과음 전체 다운로드"}
        </button>
        <button
          onClick={handleDownloadExcel}
          disabled={!!bulkDownloading}
          className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition disabled:opacity-50"
          style={{ background: "white", color: "#1E3A5F", border: "1px solid #E4DCC9" }}
        >
          <FileSpreadsheet size={14} /> {bulkDownloading === "excel" ? "엑셀 생성 중..." : "1200단어 엑셀 다운로드"}
        </button>
      </div>

      <div className="max-w-6xl mx-auto px-5 pt-5">
        <div className="relative">
          <Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "#9CA8B8" }} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="단어 검색..."
            className="w-full pl-10 pr-4 py-2.5 rounded-xl border text-sm outline-none focus:ring-2"
            style={{ borderColor: "#E4DCC9", background: "#FFFFFF" }}
          />
        </div>
      </div>

      {!query && (
        <div className="max-w-6xl mx-auto px-5 pt-4">
          <div className="flex gap-1.5 overflow-x-auto pb-1">
            {letters.map((L) => {
              const count = words.filter((w) => w.word[0].toUpperCase() === L).length;
              const active = activeLetter === L;
              return (
                <button
                  key={L}
                  onClick={() => setActiveLetter(L)}
                  disabled={count === 0}
                  className="flex-shrink-0 px-3.5 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition relative"
                  style={{
                    color: active ? "#1E3A5F" : count === 0 ? "#D8D2C4" : "#8A7F68",
                    borderColor: active ? "#D9A441" : "transparent",
                    background: active ? "#FFFFFF" : "transparent",
                  }}
                >
                  {L}
                  {count > 0 && (
                    <span className="ml-1 text-[10px] align-top" style={{ color: active ? "#D9A441" : "#B9AE94" }}>
                      {count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}

      <main className="max-w-6xl mx-auto px-5 py-5">
        {filteredWords.length === 0 ? (
          <div className="text-center py-20" style={{ color: "#9CA8B8" }}>
            {loaded ? "이 조건에 맞는 단어가 없어요." : "불러오는 중..."}
          </div>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {filteredWords.map((w) => {
              const m = media[w.word] || {};
              const hasImg = !!m.image;
              const hasAud = !!m.definitionAudio;
              const isArmed = confirmDelete === w.word;
              return (
                <div key={w.word} className="relative">
                  <button
                    onClick={() => setSelectedWord(w)}
                    className="text-left rounded-xl border p-3 transition hover:-translate-y-0.5 hover:shadow-md bg-white w-full"
                    style={{ borderColor: "#EAE2CE" }}
                  >
                    <div className="w-full aspect-square rounded-lg mb-2 flex items-center justify-center overflow-hidden" style={{ background: "#F3EEE0" }}>
                      {hasImg ? (
                        <img src={m.image} alt={w.word} className="w-full h-full object-cover" style={{ objectPosition: "0% 50%", width: "400%" }} />
                      ) : (
                        <ImageIcon size={22} style={{ color: "#C9BF9F" }} />
                      )}
                    </div>
                    <div className="font-serif text-sm font-semibold truncate" style={{ color: "#1E3A5F" }}>{w.word}</div>
                    <div className="flex items-center gap-1.5 mt-1.5">
                      <StatusDot ok={hasImg} label="그림" />
                      <StatusDot ok={hasAud} label="소리" />
                    </div>
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); setConfirmDelete(w.word); }}
                    className="absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center shadow"
                    style={{ background: "rgba(255,255,255,0.9)" }}
                  >
                    <Trash2 size={12} style={{ color: "#C4593F" }} />
                  </button>
                  {isArmed && (
                    <div
                      className="absolute inset-0 rounded-xl flex flex-col items-center justify-center gap-2 z-10"
                      style={{ background: "rgba(30,20,15,0.85)" }}
                    >
                      <span className="text-white text-xs px-2 text-center">삭제할까요?</span>
                      <div className="flex gap-2">
                        <button
                          onClick={(e) => { e.stopPropagation(); handleDeleteWord(w.word); }}
                          className="px-2.5 py-1 rounded-md text-xs font-medium"
                          style={{ background: "#C4593F", color: "white" }}
                        >
                          삭제
                        </button>
                        <button
                          onClick={(e) => { e.stopPropagation(); setConfirmDelete(null); }}
                          className="px-2.5 py-1 rounded-md text-xs font-medium"
                          style={{ background: "#EAE2CE", color: "#1E3A5F" }}
                        >
                          취소
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </main>

      {status && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full text-sm text-white shadow-lg z-50" style={{ background: "#1E3A5F" }}>
          {status}
        </div>
      )}

      {selectedWord && (
        <div className="fixed inset-0 z-40 flex justify-end">
          <div className="absolute inset-0" style={{ background: "rgba(20,25,35,0.45)" }} onClick={() => setSelectedWord(null)} />
          <div className="relative w-full sm:max-w-md h-full bg-white overflow-y-auto shadow-2xl">
            <div className="sticky top-0 z-10 flex items-center justify-between px-5 py-4 border-b" style={{ background: "#FBF7EF", borderColor: "#EAE2CE" }}>
              <div>
                <div className="text-xs" style={{ color: "#9C8F70" }}>{pendingFields.gloss || selectedWord.gloss}</div>
                <h2 className="font-serif text-2xl font-bold" style={{ color: "#1E3A5F" }}>{selectedWord.word}</h2>
              </div>
              <button onClick={() => setSelectedWord(null)} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: "#F0EADA" }}>
                <X size={16} style={{ color: "#5B6B7F" }} />
              </button>
            </div>

            <div className="p-5 space-y-6 pb-28">
              <section>
                <SectionLabel text="한글 뜻 / 사전적 정의 / 예문 (수정 가능)" />
                <div className="space-y-2">
                  <FormField label="한글 뜻" value={pendingFields.gloss} onChange={(v) => handleFieldChange("gloss", v)} placeholder="예: 따다, 줍다" />
                  <FormField label="사전적 정의 (영어)" value={pendingFields.defn} onChange={(v) => handleFieldChange("defn", v)} placeholder="To pick means to..." multiline />
                  <FormField label="예문 (영어)" value={pendingFields.example} onChange={(v) => handleFieldChange("example", v)} placeholder="This girl is picking..." multiline />
                </div>
              </section>

              <section>
                <SectionLabel icon={<ImageIcon size={15} />} text="그림 스프라이트 (4프레임, 정사각형)" />
                <UploadBox accept="image/*" onFile={handleImageUpload} hasFile={!!selectedMedia.image} />
                {selectedMedia.image && (
                  <div className="mt-3">
                    <div
                      className="mx-auto rounded-xl overflow-hidden border"
                      style={{
                        width: 180,
                        height: 180,
                        borderColor: "#EAE2CE",
                        backgroundImage: "url(" + selectedMedia.image + ")",
                        backgroundSize: "400% 100%",
                        backgroundPosition: previewPlaying ? "100% 0" : "0% 0",
                        transition: previewPlaying ? "background-position " + duration + "s steps(3)" : "none",
                      }}
                    />
                    <button onClick={togglePreview} className="mx-auto mt-2 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium" style={{ background: "#1E3A5F", color: "white" }}>
                      {previewPlaying ? <Pause size={12} /> : <Play size={12} />}
                      {previewPlaying ? "재생중" : "미리보기 재생"}
                    </button>
                  </div>
                )}
              </section>

              <section>
                <SectionLabel text="총 애니메이션 재생 시간" />
                <div className="flex items-center gap-3">
                  <input
                    type="range"
                    min={0.5}
                    max={3}
                    step={0.1}
                    value={duration}
                    onChange={(e) => handleDurationChange(parseFloat(e.target.value))}
                    className="flex-1"
                  />
                  <span className="text-sm font-mono w-14 text-right px-2 py-1 rounded-md" style={{ background: "#F0EADA", color: "#1E3A5F" }}>
                    {duration.toFixed(1)}s
                  </span>
                </div>
                <p className="text-xs mt-1" style={{ color: "#9C8F70" }}>
                  권장: 빠른 동작 1.0~1.2s · 일반 1.4~1.8s · 천천히 변하는 것 1.8~2.0s
                </p>
              </section>

              <section>
                <SectionLabel icon={<Music size={15} />} text="단어 발음 오디오" />
                <UploadBox accept="audio/*" onFile={handleWordAudioUpload} hasFile={!!selectedMedia.wordAudio} />
                {selectedMedia.wordAudio && <audio controls src={selectedMedia.wordAudio} className="w-full mt-2" style={{ height: 36 }} />}
              </section>

              <section>

// 학년 배열 (기존 사이트와 동일 순서)
const GRADES = ['4세','5세','6세','7세','초1','초2','초3','초4','초5','초6','중1','중2','중3','고등이상'];

function calcCurrentGrade(joinGrade, joinDateStr) {
  if (!joinGrade || joinGrade === '고등이상') return joinGrade || '-';
  if (!joinDateStr) return joinGrade;
  const joinDate = new Date(joinDateStr);
  const now = new Date();
  const yearsPassed = now.getFullYear() - joinDate.getFullYear();
  const gradeIdx = GRADES.indexOf(joinGrade);
  if (gradeIdx === -1) return joinGrade;
  const newIdx = Math.min(gradeIdx + yearsPassed, GRADES.length - 1);
  return GRADES[newIdx];
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// zip 안의 파일명에서 코드(단어 앞글자)와 종류를 추출합니다.
// 규칙: <코드><숫자*>M(<숫자*><S|W|D>)?.<png|jpg|jpeg|mp3>
//   예) GOAT0M.png = 이미지, GOAT0M0W.mp3 = 단어발음, GOAT0M0D.mp3 = 정의음성, GOAT0M0S.mp3 = 예문음성
const BULK_FILE_RE = /^([A-Z]{2,4})\d*M(?:\d*([SWD]))?\.(png|jpg|jpeg|mp3)$/i;

function BulkZipUploadPanel({ allWords }) {
  const [file, setFile] = useState(null);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [log, setLog] = useState([]);
  const [skipped, setSkipped] = useState([]);
  const [conflicts, setConflicts] = useState([]);

  const handleRun = async () => {
    if (!file || running) return;
    setRunning(true);
    setLog([]);
    setSkipped([]);
    setConflicts([]);
    try {
      const zip = await JSZip.loadAsync(file);

      // 1) "코드 -> 단어" 매핑 생성 (코드 = 단어 앞 4글자 대문자, 4글자보다 짧은 단어는 전체)
      const codeToWord = {};
      const conflictList = [];
      for (const w of allWords) {
        const code = w.word.slice(0, 4).toUpperCase();
        if (codeToWord[code] && codeToWord[code] !== w.word) {
          conflictList.push(code + " → " + codeToWord[code] + " / " + w.word + " 코드 중복 (뒤에 나온 " + w.word + "는 건너뜀)");
          continue;
        }
        codeToWord[code] = w.word;
      }
      setConflicts(conflictList);

      // 2) zip 안 파일들을 코드별로 묶기
      const groups = {};
      const unmatched = [];
      const entries = Object.keys(zip.files)
        .map((k) => zip.files[k])
        .filter((f) => !f.dir);

      for (const entry of entries) {
        const base = entry.name.split("/").pop();
        const m = base.match(BULK_FILE_RE);
        if (!m) { unmatched.push(entry.name + " (형식 인식 불가)"); continue; }
        const code = m[1].toUpperCase();
        const kind = m[2];
        const ext = m[3].toLowerCase();
        if (!groups[code]) groups[code] = {};
        if (ext === "png" || ext === "jpg" || ext === "jpeg") {
          groups[code].imageEntry = entry;
        } else if (kind === "W") {
          groups[code].wordAudioEntry = entry;
        } else if (kind === "D") {
          groups[code].definitionAudioEntry = entry;
        } else if (kind === "S") {
          groups[code].exampleAudioEntry = entry;
        } else {
          unmatched.push(entry.name + " (음성 종류 불명)");
        }
      }

      const codes = Object.keys(groups);
      setProgress({ done: 0, total: codes.length });

      const matchedLog = [];
      const skipReasons = [];

      for (let i = 0; i < codes.length; i++) {
        const code = codes[i];
        const word = codeToWord[code];
        if (!word) {
          skipReasons.push("코드 " + code + ": 단어 목록에서 일치하는 단어를 찾지 못함");
          setProgress({ done: i + 1, total: codes.length });
          continue;
        }
        const g = groups[code];
        const updates = {};
        const appliedFields = [];
        try {
          if (g.imageEntry) {
            updates.image = await blobToDataUrl(await g.imageEntry.async("blob"));
            appliedFields.push("이미지");
          }
          if (g.wordAudioEntry) {
            updates.wordAudio = await blobToDataUrl(await g.wordAudioEntry.async("blob"));
            appliedFields.push("단어발음");
          }
          if (g.definitionAudioEntry) {
            updates.definitionAudio = await blobToDataUrl(await g.definitionAudioEntry.async("blob"));
            appliedFields.push("정의음성");
          }
          if (g.exampleAudioEntry) {
            updates.exampleAudio = await blobToDataUrl(await g.exampleAudioEntry.async("blob"));
            appliedFields.push("예문음성");
          }
          if (appliedFields.length > 0) {
            let existing = {};
            try {
              const r = await window.storage.get("media:" + word, true);
              if (r && r.value) existing = JSON.parse(r.value);
            } catch (e) {}
            const merged = { ...existing, ...updates };
            await window.storage.set("media:" + word, JSON.stringify(merged), true);
            matchedLog.push(word + " (" + code + "): " + appliedFields.join(", "));
          }
        } catch (err) {
          skipReasons.push(word + " (" + code + "): 저장 실패 - " + err.message);
        }
        setProgress({ done: i + 1, total: codes.length });
      }

      setLog(matchedLog);
      setSkipped([...skipReasons, ...unmatched]);
    } catch (e) {
      alert("업로드 중 오류가 발생했어요: " + e.message);
    } finally {
      setRunning(false);
    }
  };

  return (
    <div className="max-w-3xl mx-auto px-5 py-6">
      <div className="bg-white rounded-xl p-5 border" style={{ borderColor: "#E7E1D3" }}>
        <h2 className="text-base font-bold mb-2" style={{ color: "#1E3A5F" }}>음성/이미지 zip 일괄 업로드</h2>
        <p className="text-sm mb-4" style={{ color: "#5B6B7F" }}>
          zip 안의 파일명 앞 4글자를 단어의 앞 4글자와 자동으로 매칭합니다. 접미사 규칙: <b>0W</b>=단어 발음,{" "}
          <b>0D</b>=정의 음성, <b>0S</b>=예문 음성, <b>.png/.jpg</b>=이미지. 이미 등록된 효과음 등 다른 정보는 그대로 유지되고,
          zip에 있는 항목만 덮어씁니다.
        </p>
        <input
          type="file"
          accept=".zip"
          onChange={(e) => setFile(e.target.files[0] || null)}
          className="text-sm mb-3 block"
        />
        <button
          onClick={handleRun}
          disabled={!file || running}
          className="px-4 py-2 rounded-lg text-sm font-semibold"
          style={{ background: file && !running ? "#D9A441" : "#E7E1D3", color: "#1E3A5F" }}
        >
          {running ? "업로드 중... (" + progress.done + "/" + progress.total + ")" : "일괄 업로드 시작"}
        </button>

        {conflicts.length > 0 && (
          <div className="mt-4 text-xs" style={{ color: "#B45309" }}>
            <b>단어 코드 중복 경고 ({conflicts.length}건)</b>
            <ul className="list-disc pl-5 mt-1 max-h-48 overflow-auto">
              {conflicts.slice(0, 30).map((c, i) => <li key={i}>{c}</li>)}
            </ul>
          </div>
        )}

        {log.length > 0 && (
          <div className="mt-4 text-xs" style={{ color: "#1E3A5F" }}>
            <b>업로드 완료 ({log.length}개 단어)</b>
            <ul className="list-disc pl-5 mt-1 max-h-60 overflow-auto">
              {log.map((l, i) => <li key={i}>{l}</li>)}
            </ul>
          </div>
        )}

        {skipped.length > 0 && (
          <div className="mt-4 text-xs" style={{ color: "#8A7F68" }}>
            <b>건너뜀 ({skipped.length}건)</b>
            <ul className="list-disc pl-5 mt-1 max-h-60 overflow-auto">
              {skipped.slice(0, 100).map((s, i) => <li key={i}>{s}</li>)}
            </ul>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PasswordGate><AdminUploadTool /></PasswordGate>);
</script>
</body>
</html>
