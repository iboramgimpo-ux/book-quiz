<script>
// ============================================================
// firebase-storage.js
// 1200 Word Dictionary - Firebase 연동 공용 스크립트 (Firestore만 사용, 무료)
//
// Storage(유료 Blaze 필요) 대신, 그림/오디오도 전부 Firestore에 직접 저장합니다.
// Firestore 문서는 1개당 1MB 제한이 있어서, 큰 필드(그림/오디오)는 자동으로
// 별도 문서에 나눠 저장하고 불러올 때 다시 합칩니다. 그래도 필드 하나가
// 900KB를 넘으면 저장이 안 되니, 그럴 땐 파일을 더 압축해서 올려주세요.
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCPa5LJHQV-nm4F3djEL1481htlJlrE0hU",
  authDomain: "book-quiz-5cfec.firebaseapp.com",
  projectId: "book-quiz-5cfec",
  storageBucket: "book-quiz-5cfec.firebasestorage.app",
  messagingSenderId: "352729909403",
  appId: "1:352729909403:web:8cbc1b592995bc2fe91e3e",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_FIELD_BYTES = 900 * 1024; // Firestore 문서 1MB 제한 대비 여유

function sanitizeKey(key) {
  return String(key).replace(/[\/\s]/g, "_");
}

function byteLength(str) {
  return new TextEncoder().encode(str).length;
}

// ---------- 몰입 모드(전체화면 + 가로 고정) 시도 ----------
// ⚠️ 반드시 사용자의 클릭/탭 이벤트 안에서 "동기적으로" 호출해야 브라우저가 허용합니다.
// - 안드로이드 Chrome: 전체화면(주소창 숨김)과 가로 고정이 모두 가능합니다.
// - iOS Safari(일반 브라우저 탭): 두 기능 모두 지원하지 않습니다. 실패해도 조용히 무시되며,
//   이 경우 아래의 CSS 회전(force-landscape) 방식으로 화면만 가로처럼 보이게 처리합니다.
//   iOS에서 주소창까지 완전히 없애려면 "홈 화면에 추가"로 실행해야 합니다.
function enterImmersive() {
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
      const p = req.call(el);
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) {}
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  } catch (e) {}
}

window.storage = {
  // value: JSON 문자열. 큰 필드(base64 그림/오디오 등)는 자동으로
  // 별도 Firestore 문서(key__필드명)로 분리 저장합니다.
  async set(key, value, shared) {
    const k = sanitizeKey(key);
    let parsed;
    try {
      parsed = JSON.parse(value);
    } catch (e) {
      parsed = value;
    }

    const external = [];
    const inline = {};

    // 문자열 필드뿐 아니라 배열 필드(효과음 여러 개 등)도 실제 바이트 크기를 계산합니다.
    // (예전 코드는 typeof v === "string"만 검사해서, 효과음 배열처럼 배열에 담긴
    //  큰 데이터는 크기 검사도, 분리 저장도 되지 않고 무조건 본문에 합쳐져서
    //  Firestore 문서 1MB 제한을 넘기면 저장이 조용히 실패하는 원인이었습니다.)
    function fieldByteLength(v) {
      if (typeof v === "string") return byteLength(v);
      if (Array.isArray(v)) return byteLength(JSON.stringify(v));
      return 0;
    }

    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        const size = fieldByteLength(v);
        if (size > MAX_FIELD_BYTES) {
          throw new Error(
            "'" + field + "' 파일이 너무 커요 (약 " + Math.round(size / 1024) +
            "KB). 900KB 이하로 압축해서 다시 올려주세요."
          );
        }
      }
      // 문서 전체가 커지지 않도록, 필드 하나당 200KB 넘으면 별도 문서로 분리
      for (const field of Object.keys(parsed)) {
        const v = parsed[field];
        if (fieldByteLength(v) > 200 * 1024) {
          external.push(field);
        } else {
          inline[field] = v;
        }
      }
    } else {
      inline.__raw = parsed;
    }

    // 본문(매니페스트) 문서에 들어갈 inline 데이터 전체 합계도 확인합니다.
    // 필드 하나하나는 200KB 미만이라도, 여러 개를 합치면 Firestore 문서
    // 1MB 제한을 넘을 수 있는데, 그러면 이 문서에 들어있는 다른 모든 정보
    // (이미지, 발음, 정의음성 등)까지 통째로 저장이 실패합니다.
    const inlineSize = byteLength(JSON.stringify(inline));
    if (inlineSize > 850 * 1024) {
      throw new Error(
        "이 항목의 전체 데이터가 너무 커요 (약 " + Math.round(inlineSize / 1024) +
        "KB). 이미지나 소리 파일 용량을 줄이거나 개수를 줄여서 다시 시도해주세요."
      );
    }

    // 별도 문서로 분리된 필드 저장
    for (const field of external) {
      await db.collection("kv").doc(k + "__" + field).set({
        value: parsed[field],
        updatedAt: Date.now(),
      });
    }

    // 매니페스트(본문) 문서 저장
    await db.collection("kv").doc(k).set({
      isManifest: true,
      value: JSON.stringify(inline),
      external: external,
      shared: !!shared,
      updatedAt: Date.now(),
    });

    // ⚠️ 실제로 서버에 저장됐는지 확인합니다.
    // Firestore는 오프라인 캐시에 먼저 쓰고 나중에 서버와 동기화하기 때문에,
    // 네트워크가 불안정하거나 보안 규칙(rules)이 쓰기를 막는 경우에도
    // 위의 set() 자체는 에러 없이 "성공한 것처럼" 끝나버릴 수 있습니다.
    // (바로 이게 "저장됐다고 나오는데 사진/소리가 사라진다"는 증상의 원인입니다.)
    // { source: "server" }로 캐시를 건너뛰고 서버에서 직접 다시 읽어 확인합니다.
    // ⚠️ 예전 코드는 "본문(매니페스트)" 문서만 확인했습니다. 그림·음성처럼 큰 파일은
    // 별도 문서(k + "__" + field)로 분리 저장되는데, 그 문서가 실제로 서버에
    // 저장됐는지는 확인하지 않아서 "저장 완료"라고 뜨는데도 그림/음성만 빠지는
    // 문제가 있었습니다. 이제 분리된 문서까지 전부 서버에서 다시 읽어 확인합니다.
    try {
      const verifyDoc = await db.collection("kv").doc(k).get({ source: "server" });
      if (!verifyDoc.exists) {
        throw new Error("문서가 서버에 저장되지 않았어요.");
      }
      for (const field of external) {
        const verifySub = await db.collection("kv").doc(k + "__" + field).get({ source: "server" });
        if (!verifySub.exists) {
          throw new Error("'" + field + "' 파일이 서버에 저장되지 않았어요.");
        }
      }
    } catch (verifyErr) {
      throw new Error(
        "저장이 서버에 반영되지 않았어요 (" +
        (verifyErr && verifyErr.message ? verifyErr.message : "확인 실패") +
        "). 인터넷 연결을 확인한 뒤 다시 저장해주세요."
      );
    }

    // 호출한 쪽에서 바로 쓸 수 있도록 완전한 값을 재조합해서 반환
    const fullValue = parsed && typeof parsed === "object" && !Array.isArray(parsed)
      ? JSON.stringify(parsed)
      : value;
    return { key, value: fullValue, shared: !!shared };
  },

  async get(key, shared) {
    const k = sanitizeKey(key);
    // 항상 서버에서 최신 값을 먼저 시도합니다. (학생 화면에 수정 전 텍스트가
    // 남아있던 문제는 오래된 캐시를 읽어서 생기는 경우가 많아, 캐시보다 서버를
    // 우선하도록 했습니다. 완전히 오프라인일 때만 캐시로 대체합니다.)
    let doc;
    try {
      doc = await db.collection("kv").doc(k).get({ source: "server" });
    } catch (e) {
      doc = await db.collection("kv").doc(k).get();
    }
    if (!doc.exists) {
      throw new Error("not found: " + key);
    }
    const data = doc.data();
    let obj;
    try {
      obj = JSON.parse(data.value);
    } catch (e) {
      obj = data.value;
    }
    if (data.external && data.external.length && obj && typeof obj === "object") {
      // ⚠️ 예전 코드는 분리 문서를 못 읽어와도 catch(e){}로 조용히 무시해서,
      // 그림/음성이 서버에 있든 없든 아무 표시 없이 그냥 빠진 채로 반환됐습니다.
      // 이제 서버에서 우선 읽고(source:"server"), 실패하면 콘솔에 경고를 남깁니다.
      const missingFields = [];
      for (const field of data.external) {
        let sub = null;
        try {
          sub = await db.collection("kv").doc(k + "__" + field).get({ source: "server" });
        } catch (e) {
          try {
            sub = await db.collection("kv").doc(k + "__" + field).get();
          } catch (e2) {
            missingFields.push(field);
            continue;
          }
        }
        if (sub && sub.exists) {
          obj[field] = sub.data().value;
        } else {
          missingFields.push(field);
        }
      }
      if (missingFields.length) {
        console.warn("[storage.get] '" + key + "'의 다음 필드를 서버에서 찾지 못했습니다: " + missingFields.join(", "));
      }
    }
    const finalValue = obj && typeof obj === "object" && obj.__raw !== undefined ? obj.__raw : JSON.stringify(obj);
    return { key, value: finalValue, shared: !!shared };
  },

  async delete(key, shared) {
    const k = sanitizeKey(key);
    try {
      const doc = await db.collection("kv").doc(k).get();
      if (doc.exists) {
        const data = doc.data();
        if (data.external && data.external.length) {
          for (const field of data.external) {
            await db.collection("kv").doc(k + "__" + field).delete().catch(() => {});
          }
        }
      }
    } catch (e) {}
    await db.collection("kv").doc(k).delete();
    return { key, deleted: true, shared: !!shared };
  },

  // prefix로 시작하는 "본문" 문서 ID들만 찾습니다 (분리 저장된 __필드 문서는 제외)
  async list(prefix, shared) {
    const p = sanitizeKey(prefix || "");
    let query = db.collection("kv");
    if (p) {
      query = query
        .where(firebase.firestore.FieldPath.documentId(), ">=", p)
        .where(firebase.firestore.FieldPath.documentId(), "<", p + "\uf8ff");
    }
    const snap = await query.get();
    const keys = [];
    snap.forEach((doc) => {
      if (doc.data().isManifest) keys.push(doc.id);
    });
    return { keys, prefix, shared: !!shared };
  },
};
</script>

// ---------- 샘플 단어 (실제로는 1200개 전체 + Firebase에서 불러옵니다) ----------
// SAMPLE_WORDS는 words.json에서 fetch로 불러옵니다 (파일 용량을 줄여 초기 로딩 속도를 개선)

const DEFAULT_DURATION = 1.6;
const DAILY_OPTIONS = [10, 20, 30, 40, 50, 60];

// ============ 앱 쉘 (화면 전환 + 뒤로가기 관리) ============
// 여러 개의 비동기 작업(예: Firestore get 800개)을 "동시에 N개씩" 실행합니다.
// 기존 코드는 for...of + await로 하나씩 순서대로 실행해서, 단어가 800~1200개면
// 각 요청의 왕복 시간이 전부 더해져 페이지 로딩이 몇 분씩 걸리는 원인이었습니다.
async function runWithConcurrency(items, limit, worker) {
  const results = new Array(items.length);
  let nextIndex = 0;
  async function runner() {
    while (nextIndex < items.length) {
      const current = nextIndex++;
      results[current] = await worker(items[current], current);
    }
  }
  const runners = [];
  for (let i = 0; i < Math.min(limit, items.length); i++) runners.push(runner());
  await Promise.all(runners);
  return results;
}

// media 객체 안에 "실제 내용"이 아니라 "존재만 표시하는 자리표시자(true)"가

// 뜨기까지 10초 넘게 걸리던 진짜 원인이었습니다.)
function mediaHasPlaceholder(m) {
  if (!m) return false;
  if (m.image === true || m.wordAudio === true || m.definitionAudio === true) return true;
  if (Array.isArray(m.soundEffects) && m.soundEffects.some((x) => x === true)) return true;
  return false;
}

async function fetchFullMediaForWord(word) {

}

function StudentApp() {
  const [screen, setScreen] = useState("home"); // home | dictionary | game | settings | study | quiz
  const [dictLetter, setDictLetter] = useState("A");
  const [studyWord, setStudyWord] = useState(null);
  const [settingsTab, setSettingsTab] = useState("log"); // log | setting
  const [dailyGoal, setDailyGoal] = useState(30);
  const [media, setMedia] = useState({});
  const [wordEdits, setWordEdits] = useState({}); // admin에서 수정한 뜻/영영풀이/예문
  const [deletedWords, setDeletedWords] = useState([]); // admin에서 삭제한 단어
  const [addedWords, setAddedWords] = useState([]); // admin에서 추가한 단어
  const [studentInfo, setStudentInfo] = useState(null); // {id, name, ...} or null(guest)
  const [todayWords, setTodayWords] = useState([]); // 오늘 완료한 단어 목록
  const [showGoalModal, setShowGoalModal] = useState(false);
  const [cycleData, setCycleData] = useState({ current: 1, lastTry: null, pending: false });
  const [baseWords, setBaseWords] = useState(null); // words.json에서 비동기로 불러옵니다
  const historyDepth = useRef(0);

  const studentId = useMemo(() => {
    const params = new URLSearchParams(location.search);
    return params.get("student") || "guest";
  }, []);
  const goalKey = "daily-goal:" + studentId;
  const progressKey = "today-progress:" + studentId;
  const cycleKey = "cycle-data:" + studentId;

  // admin.html의 word-edits(수정)/added-words(추가)/deleted-words(삭제)를 SAMPLE_WORDS 위에 합쳐서
  // 최종적으로 학생이 보는 단어 목록을 만듭니다. (이 병합이 빠져 있던 것이 텍스트 미반영 버그의 원인)
  useEffect(() => {
    fetch("words.json")
      .then((res) => res.json())
      .then((data) => setBaseWords(data))
      .catch(() => setBaseWords([])); // 실패해도 화면은 뜨게 하고 빈 목록으로 대체
  }, []);

  const applyEdit = (w) => {
    const e = wordEdits[w.word];
    return e ? { ...w, ...e } : w;
  };
  const words = useMemo(() => {
    if (!baseWords) return [];
    const deletedSet = new Set(deletedWords);
    const base = baseWords.filter((w) => !deletedSet.has(w.word)).map(applyEdit);
    const addedFiltered = addedWords.filter((w) => !deletedSet.has(w.word)).map(applyEdit);
    return [...base, ...addedFiltered];
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [baseWords, wordEdits, deletedWords, addedWords]);

  const sortedWords = useMemo(
    () => [...words].sort((a, b) => a.word.localeCompare(b.word)),
    [words]
  );
  const letters = useMemo(() => {
    const set = new Set(words.map((w) => w.word[0].toUpperCase()));
    return "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").filter((l) => set.has(l));
  }, [words]);

  const todayStr = () => new Date().toISOString().slice(0, 10);

  // ---------- 학생 정보 불러오기 ----------
  useEffect(() => {
    if (studentId === "guest") return;
    (async () => {
      try {
        const doc = await db.collection("students").doc(studentId).get();
        if (doc.exists) setStudentInfo({ id: studentId, ...doc.data() });
      } catch (e) {
        console.error("학생 정보 불러오기 실패:", e);
      }
    })();
  }, [studentId]);

  // ---------- 미디어(가벼운 목록만) + 설정 + 오늘 진행상황 불러오기 ----------
  useEffect(() => {
    (async () => {
      try {
        const keysRes = await window.storage.list("media:", true);
        if (keysRes && keysRes.keys && keysRes.keys.length) {
          const mediaObj = {};
          // ⚠️ 여기서는 그림/음성의 실제 내용(큰 base64)을 통째로 받지 않습니다.
          // 가벼운 "본문(manifest)" 문서만 읽어서 있다/없다만 파악하고, 실제 내용은
          // 사전에서 보이는 글자 탭, 지금 학습 중인 단어, 퀴즈에 나온 단어에서만
          // 그때그때 불러옵니다. (admin.html과 동일한 방식)
          await runWithConcurrency(keysRes.keys, 40, async (k) => {
            try {
              const doc = await db.collection("kv").doc(sanitizeKey(k)).get({ source: "server" });
              if (!doc.exists) return;
              const data = doc.data();
              let inline = {};
              try { inline = JSON.parse(data.value); } catch (e) { inline = {}; }
              const external = data.external || [];
              const flagsObj = { ...inline };
              for (const field of external) {
                if (!flagsObj[field]) flagsObj[field] = true; // 존재는 하지만 아직 안 불러온 상태
              }
              mediaObj[k.replace("media:", "")] = flagsObj;
            } catch (e) {}
          });
          setMedia(mediaObj);
        }
      } catch (e) {}
      // admin.html에서 수정/추가/삭제한 단어 정보를 불러옵니다.
      // (이 부분이 빠져 있어서 admin에서 영영풀이를 고쳐도 학생 화면에 반영되지 않았습니다)
      try {
        const edits = await window.storage.get("word-edits", true);
        if (edits && edits.value) setWordEdits(JSON.parse(edits.value));
      } catch (e) {}
      try {
        const del = await window.storage.get("deleted-words", true);
        if (del && del.value) setDeletedWords(JSON.parse(del.value));
      } catch (e) {}
      try {
        const add = await window.storage.get("added-words", true);
        if (add && add.value) setAddedWords(JSON.parse(add.value));
      } catch (e) {}
      try {
        const g = await window.storage.get(goalKey, false);
        if (g && g.value) setDailyGoal(JSON.parse(g.value));
      } catch (e) {}
      try {
        const p = await window.storage.get(progressKey, false);
        if (p && p.value) {
          const parsed = JSON.parse(p.value);
          if (parsed.date === todayStr()) setTodayWords(parsed.words || []);
        }
      } catch (e) {}
      try {
        const c = await window.storage.get(cycleKey, false);
        if (c && c.value) setCycleData(JSON.parse(c.value));
      } catch (e) {}
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // ---------- 뒤로가기(popstate) 처리 ----------
  const navigate = useCallback((next, extra) => {
    if (next === "study") enterImmersive(); // 사용자 탭 이벤트 안에서 바로 호출 (브라우저 허용 조건)
    historyDepth.current += 1;
    const state = { depth: historyDepth.current, screen: next };
    if (next === "study") state.wordData = extra;
    if (next === "dictionary" && extra) state.letter = extra;
    window.history.pushState(state, "");
    setScreen(next);
    if (next === "study") setStudyWord(extra);
    if (next === "dictionary" && extra) setDictLetter(extra);
  }, []);

  const goHome = useCallback(() => {
    setScreen("home");
    setStudyWord(null);
  }, []);

  useEffect(() => {
    const onPop = (e) => {
      const st = e.state;
      if (!st || historyDepth.current <= 1) {
        setScreen("home");
        setStudyWord(null);
        historyDepth.current = 0;
        return;
      }
      historyDepth.current -= 1;
      if (st.screen === "study" && st.wordData) {
        setScreen("study");
        setStudyWord(st.wordData);
      } else {
        setScreen(st.screen || "home");
        setStudyWord(null);
        if (st.screen === "dictionary" && st.letter) setDictLetter(st.letter);
      }
    };
    window.addEventListener("popstate", onPop);
    window.history.replaceState({ depth: 0, screen: "home" }, "");
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  const saveDailyGoal = async (val) => {
    setDailyGoal(val);
    try { await window.storage.set(goalKey, JSON.stringify(val), false); } catch (e) {}
  };

  // 단어 학습을 처음 완료했을 때 호출됨 (오늘 진행상황에 기록)
  const recordWordComplete = useCallback(async (word) => {
    setTodayWords((prev) => {
      if (prev.includes(word)) return prev; // 오늘 이미 학습한 단어는 중복 카운트 안 함
      const next = [...prev, word];
      window.storage.set(progressKey, JSON.stringify({ date: todayStr(), words: next }), false).catch(() => {});
      if (next.length === dailyGoal) {
        setTimeout(() => setShowGoalModal(true), 600);
      }
      return next;
    });
    // 학습 로그: 마지막 학습일 자동 기록 + 마지막 단어(zookeeper)까지 도달하면
    // 다음에 첫 단어(above)로 돌아갔을 때 cycle이 올라가도록 표시해둡니다.
    setCycleData((prev) => {
      const isLastWord = sortedWords.length > 0 && word.toLowerCase() === sortedWords[sortedWords.length - 1].word.toLowerCase();
      const next = { ...prev, lastTry: todayStr(), pending: prev.pending || isLastWord };
      window.storage.set(cycleKey, JSON.stringify(next), false).catch(() => {});
      return next;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [dailyGoal, progressKey, cycleKey, sortedWords]);

  const nextWordAfter = useCallback((current) => {
    if (!current) return null;
    const idx = sortedWords.findIndex((w) => w.word === current.word);
    if (idx === -1 || idx >= sortedWords.length - 1) return null;
    return sortedWords[idx + 1];
  }, [sortedWords]);

  const goToWord = useCallback((w) => navigate("study", w), [navigate]);

  // 학생이 마지막 단어(zookeeper)까지 마치고 다시 첫 단어(above)로 돌아오면 cycle을 1 올립니다.
  useEffect(() => {
    if (!studyWord || sortedWords.length === 0) return;
    if (studyWord.word.toLowerCase() !== sortedWords[0].word.toLowerCase()) return;
    setCycleData((prev) => {
      if (!prev.pending) return prev;
      const next = { current: prev.current + 1, lastTry: prev.lastTry, pending: false };
      window.storage.set(cycleKey, JSON.stringify(next), false).catch(() => {});
      return next;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [studyWord]);

  // ---------- 필요한 순간에만 그림/음성 실제 내용을 불러오기 ----------
  // 사전 화면: 지금 보고 있는 글자(letter)에 해당하는 단어들의 썸네일만 불러옵니다.
  useEffect(() => {
    if (screen !== "dictionary") return;
    const toFetch = words
      .filter((w) => w.word[0].toUpperCase() === dictLetter)
      .map((w) => w.word)
      .filter((word) => mediaHasPlaceholder(media[word]));
    if (toFetch.length === 0) return;
    let cancelled = false;
    (async () => {
      await runWithConcurrency(toFetch, 10, async (word) => {
        const full = await fetchFullMediaForWord(word);
        if (full && !cancelled) setMedia((prev) => ({ ...prev, [word]: full }));
      });
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [screen, dictLetter, words]);

  // 학습 화면: 지금 공부 중인 그 단어 하나만 불러옵니다.
  useEffect(() => {
    if (screen !== "study" || !studyWord) return;
    if (!mediaHasPlaceholder(media[studyWord.word])) return;
    let cancelled = false;
    (async () => {
      const full = await fetchFullMediaForWord(studyWord.word);
      if (full && !cancelled) setMedia((prev) => ({ ...prev, [studyWord.word]: full }));
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [screen, studyWord]);

  const quizWords = useMemo(
    () => todayWords.map((w) => sortedWords.find((sw) => sw.word === w)).filter(Boolean),
    [todayWords, sortedWords]
  );

  // 퀴즈 화면: 오늘 학습한 단어들(퀴즈에 나올 단어들)만 불러옵니다.
  useEffect(() => {
    if (screen !== "quiz") return;
    const toFetch = quizWords.map((w) => w.word).filter((word) => mediaHasPlaceholder(media[word]));
    if (toFetch.length === 0) return;
    let cancelled = false;
    (async () => {
      await runWithConcurrency(toFetch, 10, async (word) => {
        const full = await fetchFullMediaForWord(word);
        if (full && !cancelled) setMedia((prev) => ({ ...prev, [word]: full }));
      });
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [screen, quizWords]);

  // 학습 화면 안에서 "연결된 단어" 팝업을 탭했을 때, 아직 안 불러온 그림이면
  // 그 자리에서 바로 불러옵니다 (StudyScreen에 내려줘서 사용).
  const ensureMediaForWord = useCallback(async (word) => {
    if (!mediaHasPlaceholder(media[word])) return media[word] || null;
    const full = await fetchFullMediaForWord(word);
    if (full) setMedia((prev) => ({ ...prev, [word]: full }));
    return full;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [media]);

  if (!baseWords) {
    return (
      <div className="w-full h-screen flex items-center justify-center" style={{ background: "#0F1B2D" }}>
        <div className="w-10 h-10 rounded-full animate-spin" style={{ border: "4px solid rgba(255,255,255,0.25)", borderTopColor: "#D9A441" }} />
      </div>
    );
  }

  return (
    <div className="w-full app-height overflow-hidden" style={{ background: "#0F1B2D" }}>
      {screen === "home" && (
        <HomeScreen
          onNavigate={navigate}
          studentInfo={studentInfo}
          todayCount={todayWords.length}
          dailyGoal={dailyGoal}
        />
      )}
      {screen === "dictionary" && (
        <DictionaryScreen
          letter={dictLetter}
          setLetter={setDictLetter}
          letters={letters}
          onHome={goHome}
          onOpenWord={(w) => navigate("study", w)}
          media={media}
          words={words}
        />
      )}
      {screen === "study" && studyWord && (
        <StudyScreen
          word={studyWord}
          media={media}
          ensureMediaForWord={ensureMediaForWord}
          allWords={sortedWords}
          onHome={goHome}
          onBackToDict={() => window.history.back()}
          onGoDictionary={() => navigate("dictionary", "A")}
          onWordComplete={recordWordComplete}
          onJumpToWord={goToWord}
          hasNext={!!nextWordAfter(studyWord)}
          onNext={() => { const nw = nextWordAfter(studyWord); if (nw) goToWord(nw); }}
        />
      )}
      {screen === "game" && <GameMenuScreen onHome={goHome} />}
      {screen === "quiz" && (
        <QuizScreen
          words={quizWords}
          allWords={sortedWords}
          media={media}
          onHome={goHome}
          onFinish={goHome}
        />
      )}
      {screen === "settings" && (
        <SettingsScreen
          tab={settingsTab}
          setTab={setSettingsTab}
          onHome={goHome}
          dailyGoal={dailyGoal}
          setDailyGoal={saveDailyGoal}
          studentInfo={studentInfo}
          cycleData={cycleData}
        />
      )}

      {showGoalModal && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center px-6" style={{ background: "rgba(15,27,45,0.85)" }}>
          <div className="w-full max-w-xs rounded-2xl p-6 text-center" style={{ background: "#FBF7EF" }}>
            <Trophy size={40} style={{ color: "#D9A441", margin: "0 auto 12px" }} />
            <h2 className="font-serif text-xl font-bold mb-1" style={{ color: "#1E3A5F" }}>학습완료!</h2>
            <p className="text-sm mb-5" style={{ color: "#8A7F68" }}>
              오늘 목표 {dailyGoal}단어를 다 배웠어요.<br />퀴즈로 복습해볼까요?
            </p>
            <button

    </div>
  );
}

// TTS 엔진을 미리 "깨워서" 첫 문장이 잘려나오는 문제를 방지
let ttsPrimed = false;
function primeTts() {
  if (ttsPrimed) return;
  ttsPrimed = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");

function buildWordLookup(allWords) {
  const map = {};
  allWords.forEach((w) => {
    const base = w.word.split("/")[0].split(" / ")[0].trim().toLowerCase();
    if (base && !base.includes(" ")) map[base] = w;
  });
  return map;
}

// 복수형/과거형/-ing/비교급/최상급 등 변형된 형태에서 원형을 추정합니다.
// (완벽한 형태소 분석기는 아니지만 흔한 영어 굴절 패턴을 최대한 커버합니다)
function getWordStems(token) {
  const w = token.toLowerCase();
  const cands = new Set([w]);
  const isDoubled = (s) =>
    s.length >= 2 && s[s.length - 1] === s[s.length - 2] && !"aeiou".includes(s[s.length - 1]);

  if (w.endsWith("'s")) cands.add(w.slice(0, -2));

  if (w.endsWith("ing") && w.length > 4) {
    const stem = w.slice(0, -3);
    cands.add(stem);
    cands.add(stem + "e"); // baking -> bake
    if (isDoubled(stem)) cands.add(stem.slice(0, -1)); // running -> run
  }

  if (w.endsWith("ied") && w.length > 4) cands.add(w.slice(0, -3) + "y"); // cried -> cry
  if (w.endsWith("ed") && w.length > 3) {
    const stem = w.slice(0, -2);
    cands.add(stem);
    cands.add(stem + "e"); // hoped -> hope
    if (isDoubled(stem)) cands.add(stem.slice(0, -1)); // stopped -> stop
  }

  if (w.endsWith("ies") && w.length > 4) cands.add(w.slice(0, -3) + "y"); // flies -> fly
  if (w.endsWith("es") && w.length > 3) cands.add(w.slice(0, -2));
  if (w.endsWith("s") && !w.endsWith("ss") && w.length > 2) cands.add(w.slice(0, -1));

  if (w.endsWith("iest") && w.length > 5) cands.add(w.slice(0, -4) + "y"); // happiest -> happy
  if (w.endsWith("ier") && w.length > 4) cands.add(w.slice(0, -3) + "y"); // happier -> happy
  if (w.endsWith("est") && w.length > 4) {
    const stem = w.slice(0, -3);
    cands.add(stem);
    if (isDoubled(stem)) cands.add(stem.slice(0, -1)); // biggest -> big
  }
  if (w.endsWith("er") && w.length > 3) {
    const stem = w.slice(0, -2);
    cands.add(stem);
    if (isDoubled(stem)) cands.add(stem.slice(0, -1)); // bigger -> big
  }
  return [...cands];
}

// 1200단어 목록 중, 예문/풀이에서 빨간 링크로 표시하지 않을 품사(전치사/방향부사 등)에
// 해당하는 원형 단어들. 이 목록에 있으면 명사/형용사/동사가 아니므로 제외합니다.
const NON_HIGHLIGHT_WORDS = new Set([
  "above", "behind", "below", "between", "down", "inside", "outside", "over", "under", "up",
]);

function isHighlightableEntry(entry) {
  return !NON_HIGHLIGHT_WORDS.has(entry.word.toLowerCase());
}

function tokenizeForLinks(text) {
  return text.split(/(\b[a-zA-Z']+\b)/g);
}

// 정의(defn)와 예문(example)을 함께 훑으면서, 1200단어 목록에 있는 단어(변형 포함)를 찾아냅니다.
// - 전치사류(NON_HIGHLIGHT_WORDS)는 아예 표시하지 않습니다.
// - 같은 단어가 여러 번 나오면, 가장 마지막에 나온 것만 빨간색/클릭 가능하게 하고
//   그 앞의 것들은 검은색 일반 텍스트(클릭 불가)로 둡니다.
function buildLinkedPlan(word, lookup) {
  const defnTokens = tokenizeForLinks(word.defn);
  const exampleTokens = tokenizeForLinks(word.example);
  const allTokens = defnTokens.concat(exampleTokens);
  const boundary = defnTokens.length;

  const matches = allTokens.map((tok) => {
    if (!/^[a-zA-Z']+$/.test(tok)) return null;
    const stems = getWordStems(tok);
    let match = null;
    for (const s of stems) {
      if (lookup[s]) { match = lookup[s]; break; }
    }
    if (!match) return null;
    if (match.word.toLowerCase() === word.word.toLowerCase()) return null;
    if (!isHighlightableEntry(match)) return null;
    return match;
  });

  const lastIndexForKey = {};
  matches.forEach((m, i) => { if (m) lastIndexForKey[m.word.toLowerCase()] = i; });

  // 빨간색(클릭 가능)으로 표시할 단어는 최대 4개까지로 제한합니다.
  // 뒤쪽(마지막)에 나온 단어부터 4개를 세고, 그 앞에 있던 단어들은 검은색 일반 텍스트로 둡니다.
  const MAX_HIGHLIGHTS = 4;
  const uniqueLastIndices = Object.values(lastIndexForKey).sort((a, b) => b - a);
  const highlightIndexSet = new Set(uniqueLastIndices.slice(0, MAX_HIGHLIGHTS));

  const rendered = allTokens.map((tok, i) => {
    const m = matches[i];
    if (!m) return { text: tok, mode: "plain" };
    const isLast = lastIndexForKey[m.word.toLowerCase()] === i;
    const shouldHighlight = isLast && highlightIndexSet.has(i);
    return { text: tok, mode: shouldHighlight ? "highlight" : "muted", match: m };
  });

  return { defn: rendered.slice(0, boundary), example: rendered.slice(boundary) };
}

function LinkedSegments({ segments, onWordTap }) {
  return (
    <>
      {segments.map((seg, i) => {
        if (seg.mode === "highlight") {
          return (
            <span
              key={i}
              onClick={(e) => { e.stopPropagation(); onWordTap(seg.match, seg.text, e); }}
              style={{ color: "#C0392B", fontWeight: 600, cursor: "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}
            >
              {seg.text}
            </span>
          );
        }
        // 이미 뒤에서 다시 나오는(중복) 단어의 앞쪽 등장 - 검은색 일반 텍스트, 터치 반응 없음
        return <React.Fragment key={i}>{seg.text}</React.Fragment>;
      })}
    </>
  );
}

function StudyScreen({ word, media, ensureMediaForWord, allWords, onHome, onBackToDict, onGoDictionary, onWordComplete, onJumpToWord, hasNext, onNext }) {
  const [stage, setStage] = useState("word");
  const [animPlaying, setAnimPlaying] = useState(false);
  const [animLoop, setAnimLoop] = useState(0); // 0 또는 1 (2회 반복재생)
  const [everCompleted, setEverCompleted] = useState(false);
  const [portraitToast, setPortraitToast] = useState(false);
  const [isPortrait, setIsPortrait] = useState(false);
  const [rotSize, setRotSize] = useState(null); // { w, h } 회전 전 박스의 실제 px 크기
  const [viewport, setViewport] = useState(null); // { w, h } 항상 측정되는 실제 뷰포트 크기
  const [popup, setPopup] = useState(null); // { word, x, y }
  const audioRef = useRef(null);
  const timerRef = useRef(null);
  const toastTimerRef = useRef(null);
  const effectAudioRef = useRef(null);
  const effectTimeoutRef = useRef(null);
  const m = media[word.word] || {};
  const duration = m.duration || DEFAULT_DURATION;
  const lookup = useMemo(() => buildWordLookup(allWords), [allWords]);
  const linkedPlan = useMemo(() => buildLinkedPlan(word, lookup), [word, lookup]);

  // ---------- 가로/세로 감지: 세로여도 화면은 강제로 가로처럼 보이게 함 ----------
  // vh/vw 대신 실제 window(visualViewport) px 크기를 직접 측정해 오차/잘림을 방지합니다.
  useEffect(() => {
    primeTts();
    enterImmersive(); // 화면 진입 시에도 한 번 더 시도 (이미 study로 넘어온 탭 이벤트 체인 안)

    const measure = () => {
      const vv = window.visualViewport;
      const w = Math.round((vv && vv.width) || window.innerWidth);
      const h = Math.round((vv && vv.height) || window.innerHeight);
      const portrait = h > w;
      setIsPortrait(portrait);
      setViewport({ w, h });
      if (portrait) {
        setRotSize({ w, h });
        setPortraitToast(true);
        clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setPortraitToast(false), 1800);
      } else {
        setRotSize(null);
      }
    };

    measure();
    // 모바일 주소창이 숨겨지는 애니메이션(약 300ms) 이후 실제 크기가 바뀌므로 재측정
    const t1 = setTimeout(measure, 350);
    const t2 = setTimeout(measure, 900);

    window.addEventListener("resize", measure);
    window.addEventListener("orientationchange", measure);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", measure);

    // 모바일 주소창 자동 숨김을 위한 살짝 스크롤
    setTimeout(() => window.scrollTo(0, 1), 60);

    return () => {
      window.removeEventListener("resize", measure);
      window.removeEventListener("orientationchange", measure);
      if (window.visualViewport) window.visualViewport.removeEventListener("resize", measure);
      clearTimeout(toastTimerRef.current);
      clearTimeout(t1); clearTimeout(t2);
    };
  }, []);

  const speak = useCallback((text, onend) => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.72; u.onend = onend; u.onerror = onend;
      // 엔진이 준비될 시간을 살짝 준 뒤 재생 (첫 음절 잘림 방지)
      setTimeout(() => window.speechSynthesis.speak(u), 120);
    } catch (e) { onend && onend(); }
  }, []);

  const stopAll = useCallback(() => {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    if (audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; }
  }, []);

  // 그림이 움직이는 동안(애니메이션 단계) 효과음을 순서대로 이어서 재생하고,
  // 애니메이션이 끝나는 시점에 정확히 맞춰 소리도 함께 멈춥니다.
  const stopEffects = useCallback(() => {
    if (effectAudioRef.current) {
      try { effectAudioRef.current.pause(); } catch (e) {}
      effectAudioRef.current.onended = null;
      effectAudioRef.current = null;
    }
    clearTimeout(effectTimeoutRef.current);
  }, []);

  const playAudioOrTts = useCallback((src, text, onend) => {
    stopAll();
    // 그림/음성이 아직 자리표시자(true)일 수도 있으니, 실제 내용(문자열)일 때만 재생을 시도합니다.
    if (typeof src === "string" && src) {
      // ⚠️ 재생이 실패하면 오디오 요소의 onerror 이벤트와 play()가 반환하는
      // Promise의 reject가 "둘 다" 발생하는 경우가 있어서, 예전 코드는 TTS
      // 대체 읽기(speak)가 두 번 호출돼 같은 문장을 두 번 읽는 버그가 있었습니다.
      // (내가 올린 발음/설명 음성이 재생된 뒤 TTS가 같은 문장을 또 읽던 원인)
      // 아래처럼 한 번만 실행되도록 막아줍니다.
      let fallbackDone = false;
      const fallbackToTts = () => {
        if (fallbackDone) return;
        fallbackDone = true;
        speak(text, onend);
      };
      const a = new Audio(src);
      audioRef.current = a;
      a.onended = onend;
      a.onerror = fallbackToTts;
      a.play().catch(fallbackToTts);
    } else {
      speak(text, onend);
    }
  }, [speak, stopAll]);

  // 정의(definitionAudio) 음원이 올라와 있으면 그 음원만 재생하고, 예문은 TTS로
  // 따로 읽지 않습니다 (선생님 녹음 안에 예문까지 포함된 경우가 많아 중복 재생을 막기 위함).
  // 정의 음원이 없는 단어만 뜻풀이+예문을 순서대로 TTS로 읽어줍니다.
  const playDefAndExample = useCallback(async (onend) => {
    let defAudio = m.definitionAudio;
    if (defAudio === true && ensureMediaForWord) {
      // 아직 자리표시자(true)만 있고 실제 내용을 안 불러온 상태면 지금 불러와서 확인합니다.
      const full = await ensureMediaForWord(word.word);
      defAudio = full && typeof full.definitionAudio === "string" ? full.definitionAudio : null;
    }
    if (typeof defAudio === "string" && defAudio) {
      playAudioOrTts(defAudio, word.defn, onend);
    } else {
      speak(word.defn, () => speak(word.example, onend));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [playAudioOrTts, speak, ensureMediaForWord, m.definitionAudio, word.defn, word.example, word.word]);

  useEffect(() => {
    stopAll();
    stopEffects();
    clearTimeout(timerRef.current);
    setAnimPlaying(false);
    setAnimLoop(0);
    setEverCompleted(false);
    setPopup(null);
    setStage("word");
    playAudioOrTts(m.wordAudio, word.word, () => setStage("animation"));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [word.word]);

  // 애니메이션을 2회 반복 재생
  useEffect(() => {
    if (stage !== "animation") return;
    setAnimPlaying(false);
    requestAnimationFrame(() => {
      setAnimPlaying(true);
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        if (animLoop === 0) {
          setAnimLoop(1); // 이 useEffect가 다시 실행되며 2번째 루프 재생
        } else {
          setStage("definition");
        }
      }, duration * 1000);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage, animLoop]);

  // 효과음(최대 4개)을 애니메이션 시작과 동시에 순서대로 재생하고,
  // 그림 애니메이션 총 재생 시간(2회 반복)이 끝나면 자동으로 멈춥니다.
  useEffect(() => {
    if (stage !== "animation") { stopEffects(); return; }
    const effects = (m.soundEffects || []).filter(Boolean);
    if (effects.length === 0) return undefined;
    const totalAnimMs = Math.max(0, duration * 1000 * 2 - 50);
    const startedAt = Date.now();
    let cancelled = false;
    const playNext = (idx) => {
      if (cancelled) return;
      if (idx >= effects.length) return;
      if (Date.now() - startedAt >= totalAnimMs) return;
      const a = new Audio(effects[idx]);
      effectAudioRef.current = a;
      a.onended = () => playNext(idx + 1);
      a.play().catch(() => playNext(idx + 1));
    };
    playNext(0);
    effectTimeoutRef.current = setTimeout(stopEffects, totalAnimMs);
    return () => { cancelled = true; stopEffects(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage]);

  useEffect(() => {
    if (stage === "definition") {
      playDefAndExample(() => setStage("done"));
    } else if (stage === "done") {
      setEverCompleted(true);
      onWordComplete && onWordComplete(word.word);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage]);

  const tapWord = () => playAudioOrTts(m.wordAudio, word.word, () => {});
  const tapImage = () => {
    setAnimPlaying(false);
    requestAnimationFrame(() => setAnimPlaying(true));
  };
  const tapDef = () => playDefAndExample(() => {});

  // 회전 여부와 상관없이 "화면에 보이는 그대로의" 가로/세로를 기준으로 정사각형 한 변 길이를 px로 계산
  // (회전된 박스 안에서는 CSS vh/vw가 실제 시각적 크기와 어긋나서 그림이 정사각형으로 안 보이는 문제 해결)
  const squareSize = useMemo(() => {
    if (!viewport) return 300;
    const eff = isPortrait ? { w: viewport.h, h: viewport.w } : { w: viewport.w, h: viewport.h };
    return Math.round(Math.max(120, Math.min(0.7 * eff.h, 0.46 * eff.w)));
  }, [viewport, isPortrait]);

  const handleLinkedWordTap = async (matchWord, surfaceText) => {
    // 화면에 표기된 형태 그대로 발음 (예: flying)
    try { window.speechSynthesis.cancel(); } catch (err) {}
    const u = new SpeechSynthesisUtterance(surfaceText);
    u.lang = "en-US"; u.rate = 0.75;
    setTimeout(() => window.speechSynthesis.speak(u), 80);

    let linkedMedia = media[matchWord.word] || {};
    setPopup({ word: matchWord, image: typeof linkedMedia.image === "string" ? linkedMedia.image : null });
    // 아직 그림 내용을 안 불러온 단어면(자리표시자만 있는 상태) 지금 바로 불러와서 팝업에 채워줍니다.
    if (ensureMediaForWord && mediaHasPlaceholder(linkedMedia)) {
      const full = await ensureMediaForWord(matchWord.word);
      if (full && typeof full.image === "string") {
        setPopup((prev) => (prev && prev.word.word === matchWord.word ? { ...prev, image: full.image } : prev));
      }
    }
  };

  return (
    <div
      className={"w-full h-full relative" + (isPortrait ? " force-landscape" : "")}
      style={
        isPortrait && rotSize
          ? {
              background: "#0F1B2D",
              width: rotSize.h + "px",
              height: rotSize.w + "px",
              transform: "rotate(90deg) translateY(-100%)",
            }
          : { background: "#0F1B2D" }
      }
    >
      {portraitToast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2 rounded-full text-white text-xs" style={{ background: "rgba(0,0,0,0.75)" }}>
          <RotateCw size={13} /> 가로 화면에 최적화되어 있어요
        </div>
      )}
      <div className="w-full h-full flex" style={{ background: "#FBF7EF" }}>
        <div className="w-1/2 h-full flex flex-col justify-center px-10 lg:px-16">
          <div className="absolute top-4 left-4 z-10 flex items-center gap-2">
            <button onClick={onHome} className="w-11 h-11 rounded-full flex items-center justify-center shadow-md" style={{ background: "#D9A441" }}>
              <Home size={20} style={{ color: "#1E3A5F" }} />
            </button>
            <button onClick={onGoDictionary} className="h-11 px-4 rounded-full flex items-center justify-center shadow-md text-sm font-semibold" style={{ background: "#D9A441", color: "#1E3A5F" }}>
              Dictionary
            </button>
          </div>
          <button onClick={tapWord} className="text-left group">
            <div className="font-serif font-extrabold leading-none tracking-tight" style={{ fontSize: "clamp(2.5rem, 7vw, 5rem)", color: "#2563EB" }}>
              {word.word}
            </div>
            <div className="flex items-center gap-1.5 mt-1 text-xs" style={{ color: "#9CA8B8" }}>
              <Volume2 size={13} /> 탭해서 다시 듣기
            </div>
          </button>
          <div className="text-left mt-6" onClick={tapDef} style={{ cursor: "pointer" }}>
            <p style={{ fontSize: "clamp(0.95rem, 1.6vw, 1.15rem)", color: "#374151" }}>
              <LinkedSegments segments={linkedPlan.defn} onWordTap={handleLinkedWordTap} />
            </p>
            <p className="italic mt-2" style={{ fontSize: "clamp(0.95rem, 1.6vw, 1.15rem)", color: "#6B7280" }}>
              <LinkedSegments segments={linkedPlan.example} onWordTap={handleLinkedWordTap} />
            </p>
          </div>
        </div>
        <div className="w-1/2 h-full flex items-center justify-center p-8">
          <button onClick={tapImage} className="relative rounded-2xl overflow-hidden shadow-lg" style={{ width: squareSize + "px", height: squareSize + "px", background: "#F3EEE0", border: "1px solid #EAE2CE" }}>
            {typeof m.image === "string" ? (
              <div className="w-full h-full" style={{ backgroundImage: "url(" + m.image + ")", backgroundSize: "400% 100%", backgroundPosition: animPlaying ? "100% 0" : "0% 0", transition: animPlaying ? "background-position " + duration + "s steps(3)" : "none" }} />
            ) : (
              <div className="w-full h-full flex items-center justify-center text-sm" style={{ color: "#C9BF9F" }}>이미지 없음</div>
            )}
          </button>
        </div>
      </div>

      {/* 단어 연결 팝업 (두번째 컷 미리보기) */}
      {popup && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(15,27,45,0.55)" }} onClick={() => setPopup(null)}>
          <div className="rounded-2xl bg-white p-4 shadow-2xl" style={{ width: 220 }} onClick={(e) => e.stopPropagation()}>
            <button
              onClick={() => { setPopup(null); onJumpToWord(popup.word); }}
              className="w-full rounded-xl overflow-hidden mb-3"
              style={{ height: 140, background: "#F3EEE0", border: "1px solid #EAE2CE" }}
            >
              {popup.image ? (
                <div className="w-full h-full" style={{ backgroundImage: "url(" + popup.image + ")", backgroundSize: "400% 100%", backgroundPosition: "33.333% 0" }} />
              ) : (
                <div className="w-full h-full flex items-center justify-center text-xs" style={{ color: "#C9BF9F" }}>이미지 없음</div>
              )}
            </button>
            <p className="text-center font-serif text-lg font-bold mb-1" style={{ color: "#1E3A5F" }}>{popup.word.word}</p>
            <p className="text-center text-xs mb-3" style={{ color: "#9C8F70" }}>탭하면 이 단어로 이동해요</p>
            <button onClick={() => setPopup(null)} className="w-full py-2 rounded-lg text-xs font-medium" style={{ background: "#F0EADA", color: "#5B6B7F" }}>
              닫기
            </button>
          </div>
        </div>
      )}

      <div className="fixed bottom-0 left-0 right-0 flex items-center justify-between px-6 py-3" style={{ background: "rgba(15,27,45,0.9)" }}>
        <button onClick={onBackToDict} className="flex items-center gap-1 text-sm px-3.5 py-2 rounded-full font-medium" style={{ background: "#D9A441", color: "#1E3A5F" }}>
          <ChevronLeft size={16} /> Back
        </button>
        {everCompleted ? (
          <span className="flex items-center gap-1.5 text-xs" style={{ color: "#8FD19E" }}><CheckCircle2 size={14} /> 학습 완료</span>
        ) : (
          <span className="text-xs" style={{ color: "#B7C6DA" }}>발음과 풀이를 끝까지 들으면 다음으로 넘어갈 수 있어요</span>
        )}
        <button
          onClick={onNext}
          disabled={!everCompleted || !hasNext}
          className="flex items-center gap-1 text-sm px-4 py-2 rounded-full font-medium transition"
          style={{
            background: everCompleted && hasNext ? "#D9A441" : "#2A3B52",
            color: everCompleted && hasNext ? "#1E3A5F" : "#5B6B7F",
            cursor: everCompleted && hasNext ? "pointer" : "not-allowed",
          }}
        >
          Next <ChevronRight size={18} />
        </button>
      </div>
    </div>
  );
}


// ============ 퀴즈 화면 (일일 목표 달성 후 자동 출제) ============
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuizQuestions(words, allWords) {
  const pool = words.length >= 4 ? words : allWords; // 정답 후보가 너무 적으면 전체 풀에서 보충
  const count = Math.min(10, Math.max(words.length, 1));
  const picks = shuffleArr(words.length ? words : allWords).slice(0, count);
  return picks.map((w, i) => {
    const type = i % 2 === 0 ? "mc" : "spell";
    if (type === "mc") {
      const distractors = shuffleArr(pool.filter((x) => x.word !== w.word)).slice(0, 3);
      const choices = shuffleArr([w, ...distractors]);
      return { type, word: w, choices };
    } else {
      const letters = w.word.split("");
      const blankCount = letters.length <= 3 ? 1 : 2;
      const idxs = shuffleArr(letters.map((_, i2) => i2)).slice(0, blankCount).sort((a2, b2) => a2 - b2);
      return { type, word: w, blankIdxs: idxs };
    }
  });
}

function QuizScreen({ words, allWords, media, onHome, onFinish }) {
  const [questions] = useState(() => buildQuizQuestions(words, allWords));
  const [qIndex, setQIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [correctCount, setCorrectCount] = useState(0);
  const [blanks, setBlanks] = useState([]);
  const [phase, setPhase] = useState(questions.length ? "playing" : "empty");
  const inputRefs = useRef([]);

  const q = questions[qIndex];

  useEffect(() => {
    if (q && q.type === "spell") {
      setBlanks(q.blankIdxs.map(() => ""));
      inputRefs.current = [];
    }
    setSelected(null);
    setAnswered(false);
  }, [qIndex]); // eslint-disable-line react-hooks/exhaustive-deps

  useEffect(() => {
    if (phase === "playing" && q && q.type === "spell" && !answered) {
      setTimeout(() => inputRefs.current[0]?.focus(), 100);
    }
  }, [qIndex, phase]); // eslint-disable-line react-hooks/exhaustive-deps

  if (phase === "empty") {
    return (
      <div className="w-full h-full flex flex-col items-center justify-center gap-4 px-6" style={{ background: "#0F1B2D" }}>
        <p className="text-white text-sm">오늘 학습한 단어가 없어서 퀴즈를 만들 수 없어요.</p>
        <button onClick={onHome} className="px-5 py-2.5 rounded-full text-sm font-medium" style={{ background: "#D9A441", color: "#1E3A5F" }}>홈으로</button>
      </div>
    );
  }

  if (phase === "result") {
    const pct = Math.round((correctCount / questions.length) * 100);
    return (
      <div className="w-full h-full flex flex-col items-center justify-center gap-4 px-6" style={{ background: "#0F1B2D" }}>
        <Trophy size={44} style={{ color: "#D9A441" }} />
        <h1 className="text-white font-serif text-2xl font-bold">퀴즈 완료!</h1>
        <p className="text-5xl font-extrabold" style={{ color: "#8FD19E" }}>{correctCount} / {questions.length}</p>
        <p className="text-sm" style={{ color: "#B7C6DA" }}>정답률 {pct}%</p>
        <button onClick={onFinish} className="mt-2 px-6 py-3 rounded-full font-medium text-sm" style={{ background: "#D9A441", color: "#1E3A5F" }}>
          홈으로
        </button>
      </div>
    );
  }

  const m = media[q.word.word] || {};
  const frame2Style = {
    backgroundImage: typeof m.image === "string" ? "url(" + m.image + ")" : undefined,
    backgroundSize: "400% 100%",
    backgroundPosition: "33.333% 0",
  };

  const selectMc = (choice) => {
    if (answered) return;
    setSelected(choice.word);
    setAnswered(true);
    if (choice.word === q.word.word) setCorrectCount((c) => c + 1);
  };

  const handleBlankChange = (i, val) => {
    if (answered) return;
    const ch = val.slice(-1);
    const next = [...blanks];
    next[i] = ch;
    setBlanks(next);
    if (ch && i < blanks.length - 1) inputRefs.current[i + 1]?.focus();
    if (ch && i === blanks.length - 1) checkSpelling(next);
  };

  const checkSpelling = (arr) => {
    const letters = q.word.word.split("");
    let ok = true;
    q.blankIdxs.forEach((idx, i) => {
      if ((arr[i] || "").toLowerCase() !== letters[idx].toLowerCase()) ok = false;
    });
    setAnswered(true);
    if (ok) setCorrectCount((c) => c + 1);
  };

  const next = () => {
    if (qIndex + 1 >= questions.length) setPhase("result");
    else setQIndex((i) => i + 1);
  };

  return (
    <div className="w-full h-full flex flex-col" style={{ background: "#FBF7EF" }}>
      <div className="flex items-center justify-between px-5 py-4" style={{ background: "#1E3A5F" }}>
        <button onClick={onHome} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: "#D9A441" }}>
          <Home size={17} style={{ color: "#1E3A5F" }} />
        </button>
        <h1 className="text-white font-serif text-base font-bold">오늘의 퀴즈</h1>
        <span className="text-white text-sm font-mono">{qIndex + 1} / {questions.length}</span>
      </div>
      <div className="h-1.5 w-full" style={{ background: "#EAE2CE" }}>
        <div className="h-full transition-all" style={{ width: (qIndex / questions.length) * 100 + "%", background: "#D9A441" }} />
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 py-4 gap-5">
        <div className="rounded-2xl overflow-hidden shadow-md" style={{ width: "min(38vh,220px)", height: "min(38vh,220px)", background: "#F3EEE0", border: "1px solid #EAE2CE" }}>
          <div className="w-full h-full" style={frame2Style} />
        </div>

        {q.type === "mc" ? (
          <>
            <p className="text-xs" style={{ color: "#9C8F70" }}>이 그림에 맞는 단어를 고르세요</p>
            <div className="grid grid-cols-2 gap-3 w-full max-w-md">
              {q.choices.map((c) => {
                const isCorrect = c.word === q.word.word;
                const isSelected = selected === c.word;
                let bg = "white", border = "#EAE2CE", color = "#1E3A5F";
                if (answered) {
                  if (isCorrect) { bg = "#E7F3E9"; border = "#8FD19E"; color = "#2E6B3E"; }
                  else if (isSelected) { bg = "#FBEAE6"; border = "#E2A093"; color = "#B0402C"; }
                }
                return (
                  <button key={c.word} onClick={() => selectMc(c)} disabled={answered}
                    className="py-3.5 rounded-xl font-serif text-base font-semibold border transition"
                    style={{ background: bg, borderColor: border, color }}>
                    {c.word}
                  </button>
                );
              })}
            </div>
          </>
        ) : (
          <>
            <p className="text-xs" style={{ color: "#9C8F70" }}>빈칸에 알맞은 철자를 채우세요</p>
            <div className="flex gap-1.5 flex-wrap justify-center max-w-lg">
              {q.word.word.split("").map((ch, i) => {
                const blankPos = q.blankIdxs.indexOf(i);
                if (blankPos === -1) {
                  return (
                    <div key={i} className="w-9 h-11 rounded-lg flex items-center justify-center font-serif text-lg font-bold"
                      style={{ background: "#F0EADA", color: "#B0A588" }}>
                      {ch}
                    </div>
                  );
                }
                let border = "#D8CDB0", bg = "white", color = "#1E3A5F";
                if (answered) {
                  const ok = (blanks[blankPos] || "").toLowerCase() === ch.toLowerCase();
                  border = ok ? "#8FD19E" : "#E2A093";
                  bg = ok ? "#E7F3E9" : "#FBEAE6";
                  color = ok ? "#2E6B3E" : "#B0402C";
                }
                return (
                  <input
                    key={i}
                    ref={(el) => (inputRefs.current[blankPos] = el)}
                    value={blanks[blankPos] || ""}
                    onChange={(e) => handleBlankChange(blankPos, e.target.value)}
                    disabled={answered}
                    maxLength={1}
                    className="w-9 h-11 text-center rounded-lg border-2 font-serif text-lg font-bold outline-none"
                    style={{ borderColor: border, background: bg, color }}
                  />
                );
              })}
            </div>
            {answered && (
              <p className="text-xs" style={{ color: "#9C8F70" }}>정답: <b className="font-serif" style={{ color: "#1E3A5F" }}>{q.word.word}</b></p>
            )}
          </>
        )}

        {answered && (
          <button onClick={next} className="flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-medium" style={{ background: "#D9A441", color: "#1E3A5F" }}>
            다음 <ChevronRight size={16} />
          </button>
        )}
        {q.type === "spell" && !answered && (
          <button onClick={() => checkSpelling(blanks)} className="flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-medium" style={{ background: "#1E3A5F", color: "white" }}>
            확인
          </button>
        )}
      </div>
    </div>
  );
}

// ============ 게임 메뉴 화면 (플레이스홀더, 다음 단계에서 겁개로 구현) ============
function GameMenuScreen({ onHome }) {
  const games = [
    { title: "뜻 맞추기", desc: "영영풀이와 정지화면을 보고 단어 맞추기" },
    { title: "스펙링", desc: "들리는 단어를 보고 철자 쓰기" },
    { title: "유의어/반의어", desc: "같거나 반대되는 뜻의 단어 맞추기" },
    { title: "그림단어 짝짓기", desc: "1분 안에 그림과 단어 5쌍 짝짓기" },
  ];
  return (
    <div className="w-full h-full flex flex-col" style={{ background: "#FBF7EF" }}>
      <div className="flex items-center justify-between px-5 py-4" style={{ background: "#1E3A5F" }}>
        <button onClick={onHome} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: "#D9A441" }}>
          <Home size={17} style={{ color: "#1E3A5F" }} />
        </button>
        <h1 className="text-white font-serif text-lg font-bold">Game</h1>
        <div className="w-9" />
      </div>
      <div className="flex-1 overflow-y-auto p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
        {games.map((g) => (
          <div key={g.title} className="rounded-2xl bg-white p-5 border" style={{ borderColor: "#EAE2CE" }}>
            <div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3" style={{ background: "#EAF1FB" }}>
              <Gamepad2 size={20} style={{ color: "#2563EB" }} />
            </div>
            <h3 className="font-serif text-base font-bold mb-1" style={{ color: "#1E3A5F" }}>{g.title}</h3>
            <p className="text-xs" style={{ color: "#8A7F68" }}>{g.desc}</p>
            <span className="inline-block mt-3 text-[11px] px-2 py-1 rounded-full" style={{ background: "#F5EFE2", color: "#B0A588" }}>준비중</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============ 설정 화면 ============
function SettingsScreen({ tab, setTab, onHome, dailyGoal, setDailyGoal, studentInfo, cycleData }) {
  return (
    <div className="w-full h-full flex flex-col" style={{ background: "#FBF7EF" }}>
      <div className="flex items-center justify-between px-5 py-4" style={{ background: "#1E3A5F" }}>
        <button onClick={onHome} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: "#D9A441" }}>
          <Home size={17} style={{ color: "#1E3A5F" }} />
        </button>
        <h1 className="text-white font-serif text-lg font-bold">Settings</h1>
        <div className="w-9" />
      </div>

      <div className="flex px-5 pt-4 gap-2">
        <TabButton active={tab === "log"} onClick={() => setTab("log")} label="Learning Log" />
        <TabButton active={tab === "setting"} onClick={() => setTab("setting")} label="Setting" />
      </div>

      <div className="flex-1 overflow-y-auto p-5">
        {tab === "log" ? <LearningLogPanel studentInfo={studentInfo} cycleData={cycleData} /> : <SettingPanel dailyGoal={dailyGoal} setDailyGoal={setDailyGoal} />}
      </div>
    </div>
  );
}

function TabButton({ active, onClick, label }) {
  return (
    <button
      onClick={onClick}
      className="px-4 py-2 rounded-t-lg text-sm font-semibold border-b-2 transition"
      style={{ color: active ? "#1E3A5F" : "#8A7F68", borderColor: active ? "#D9A441" : "transparent", background: active ? "white" : "transparent" }}
    >
      {label}
    </button>
  );
}

const TOTAL_CYCLES = 10;

function LearningLogPanel({ studentInfo, cycleData }) {
  const name = studentInfo ? studentInfo.name : "(학생 링크로 접속하면 이름이 표시돼요)";
  const current = (cycleData && cycleData.current) || 1;
  const lastTry = cycleData && cycleData.lastTry;
  const cycleLabel = (n) => n + (n === 1 ? " cycle" : " cycles");
  return (
    <div className="max-w-md space-y-3">
      <LogRow icon={<User size={16} />} label="Name" value={name} />
      <LogRow icon={<TrendingUp size={16} />} label="Cycles" value={cycleLabel(TOTAL_CYCLES)} />
      <LogRow icon={<TrendingUp size={16} />} label="Current cycle" value={cycleLabel(current)} />
      <LogRow icon={<Calendar size={16} />} label="Last try" value={lastTry || "-"} />
    </div>
  );
}

function LogRow({ icon, label, value, progress }) {
  return (
    <div className="rounded-xl bg-white border p-4" style={{ borderColor: "#EAE2CE" }}>
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2 text-sm" style={{ color: "#8A7F68" }}>
          {icon} {label}
        </div>
        <span className="font-serif text-lg font-bold" style={{ color: "#1E3A5F" }}>{value}</span>
      </div>
      {progress !== undefined && (
        <div className="w-full h-2 rounded-full mt-2 overflow-hidden" style={{ background: "#F0EADA" }}>
          <div className="h-full rounded-full" style={{ width: progress + "%", background: "#D9A441" }} />
        </div>
      )}
    </div>
  );
}

function SettingPanel({ dailyGoal, setDailyGoal }) {
  return (
    <div className="max-w-md">
      <p className="text-sm font-semibold mb-3" style={{ color: "#1E3A5F" }}>하루에 공부할 단어 수</p>
      <div className="grid grid-cols-3 gap-2">
        {DAILY_OPTIONS.map((n) => (
          <button
            key={n}
            onClick={() => setDailyGoal(n)}
            className="py-3 rounded-xl text-sm font-semibold transition"
            style={{
              background: dailyGoal === n ? "#D9A441" : "white",
              color: dailyGoal === n ? "#1E3A5F" : "#8A7F68",
              border: "1px solid " + (dailyGoal === n ? "#D9A441" : "#EAE2CE"),
            }}
          >
            {n}개
          </button>
        ))}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StudentApp />);
</script>
</body>
</html>
